<meta charset="UTF-8">

<title>e-PBD PPKI • Sistem Pelaporan Pentaksiran Bilik Darjah</title>
<meta name="description" content="Aplikasi pelaporan PBD digital: rekod tahap penguasaan, laporan murid dan sijil PBD.">
<meta name="theme-color" content="#0f5257">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">

<script defer src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --ink:#10292b;--ink-2:#3d5a5c;--muted:#7a9294;--bg:#f4f1ea;--paper:#fffdf8;--line:#e3ddd0;
  --brand:#0f5257;--brand-2:#147a72;--brand-soft:#dcefeb;--gold:#c9962b;--gold-soft:#f7ecd2;
  --danger:#b4412f;--ok:#2f7d4f;--warn:#c27d0e;
  --tp1:#d9534f;--tp2:#ee8a3c;--tp3:#e8c13a;--tp4:#8cc152;--tp5:#3aa57a;--tp6:#147a72;
  --r:16px;--shadow:0 10px 30px -12px rgba(16,41,43,.25);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Plus Jakarta Sans',system-ui,sans-serif;font-size:15px}
h1,h2,h3,.serif{font-family:'Fraunces',Georgia,serif;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--brand-2)}
/* ---------- Shell ---------- */
.app{display:grid;grid-template-columns:260px 1fr;min-height:100vh}
.side{background:var(--brand);color:#eaf6f4;padding:22px 16px;position:sticky;top:0;height:100vh;overflow:auto;
  background-image:radial-gradient(circle at 20% 0%,rgba(255,255,255,.12),transparent 40%),radial-gradient(circle at 100% 100%,rgba(201,150,43,.25),transparent 45%)}
.logo{display:flex;gap:12px;align-items:center;margin-bottom:26px}
.logo .mark{width:44px;height:44px;border-radius:12px;background:var(--gold);display:grid;place-items:center;font-family:Fraunces;font-weight:900;color:var(--brand);font-size:20px}
.logo b{font-family:Fraunces;font-size:22px;display:block}
.logo small{opacity:.75;font-size:12px}
.nav button{display:flex;width:100%;gap:12px;align-items:center;padding:11px 14px;border:0;background:none;border-radius:12px;cursor:pointer;color:#d9eeea;font-weight:600;text-align:left;margin-bottom:3px}
.nav button:hover{background:rgba(255,255,255,.08)}
.nav button.on{background:var(--paper);color:var(--brand)}
.nav .ico{width:22px;text-align:center}
.side .btn{color:var(--ink)}
.side .who{margin-top:22px;padding:14px;border-radius:14px;background:rgba(0,0,0,.18);font-size:13px}
.main{padding:26px 34px 60px;min-width:0}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.top h1{margin:0;font-size:30px}
.top p{margin:4px 0 0;color:var(--ink-2)}
.chip{display:inline-flex;gap:6px;align-items:center;padding:6px 12px;border-radius:999px;background:var(--brand-soft);color:var(--brand);font-weight:700;font-size:12px}
.chip.gold{background:var(--gold-soft);color:#8a6312}
.chip.red{background:#f6dcd6;color:var(--danger)}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--shadow)}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}
.stat .n{font-family:Fraunces;font-size:36px;font-weight:900;color:var(--brand)}
.stat .l{color:var(--ink-2);font-size:13px;font-weight:600}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:12px;border:1px solid var(--line);background:var(--paper);cursor:pointer;font-weight:700}
.btn:hover{border-color:var(--brand-2)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.pri:hover{background:var(--brand-2)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#fff}
.btn.danger{color:var(--danger)}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:9px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
input.f,select.f,textarea.f{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff}
input.f:focus,select.f:focus,textarea.f:focus{outline:2px solid var(--brand-soft);border-color:var(--brand-2)}
label.l{font-size:12px;font-weight:700;color:var(--ink-2);display:block;margin:10px 0 5px;text-transform:uppercase;letter-spacing:.04em}
table.t{width:100%;border-collapse:separate;border-spacing:0;font-size:14px}
table.t th{position:sticky;top:0;background:var(--brand);color:#fff;text-align:left;padding:10px;font-size:12px;font-weight:700;vertical-align:bottom}
table.t th:first-child{border-top-left-radius:10px}table.t th:last-child{border-top-right-radius:10px}
table.t td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
table.t tr:hover td{background:#faf6ec}
.tw{overflow:auto;max-height:70vh;border-radius:12px}
.tp{display:inline-grid;place-items:center;min-width:34px;height:28px;border-radius:8px;font-weight:800;color:#fff;font-size:13px;padding:0 6px}
.tp1{background:var(--tp1)}.tp2{background:var(--tp2)}.tp3{background:var(--tp3);color:#4a3a00}.tp4{background:var(--tp4)}.tp5{background:var(--tp5)}.tp6{background:var(--tp6)}.tp0{background:#ddd;color:#777}
select.tpsel{padding:6px;border-radius:8px;border:1px solid var(--line);font-weight:700;width:64px;text-align:center}
.empty{padding:40px;text-align:center;color:var(--muted)}
.toast{position:fixed;right:20px;bottom:20px;background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;box-shadow:var(--shadow);z-index:99;opacity:0;transform:translateY(10px);transition:.25s;max-width:420px}
.toast.show{opacity:1;transform:none}.toast.err{background:var(--danger)}
.modal{position:fixed;inset:0;background:rgba(16,41,43,.55);display:none;place-items:center;z-index:50;padding:16px}
.modal.show{display:grid}
.modal .box{background:var(--paper);border-radius:20px;padding:24px;width:min(640px,100%);max-height:90vh;overflow:auto}
.loader{position:fixed;inset:0;background:var(--bg);display:grid;place-items:center;z-index:100}
.spin{width:46px;height:46px;border:4px solid var(--brand-soft);border-top-color:var(--brand);border-radius:50%;animation:s 1s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
.lock{color:var(--muted);font-size:13px}
.bar{height:10px;border-radius:99px;background:#eee;overflow:hidden;display:flex}
.bar span{display:block;height:100%}
.mob{display:none}
.hint{font-size:13px;color:var(--ink-2);background:var(--gold-soft);border-radius:12px;padding:10px 14px}
/* ---------- Laporan (cetakan) ---------- */
.sheet{background:#fff;color:#000;width:210mm;min-height:297mm;padding:14mm 14mm 12mm;margin:0 auto 20px;box-shadow:var(--shadow);font-family:Arial,Helvetica,sans-serif;font-size:11.5px;position:relative}
.sheet h2{font-family:Arial;text-align:center;font-size:17px;margin:0 0 12px;letter-spacing:.02em}
.sheet .info{display:grid;grid-template-columns:1fr 1fr;gap:3px 20px;margin-bottom:10px}
.sheet .info div b{display:inline-block;min-width:92px}
.sheet table{width:100%;border-collapse:collapse}
.sheet th,.sheet td{border:1px solid #000;padding:6px 7px;vertical-align:middle}
.sheet th{background:#d9e8e6;font-size:11px}
.sheet td.mp{font-weight:700;width:24%}
.sheet td.tpc{text-align:center;font-weight:700;width:12%}
.sheet .ul{margin:12px 0;line-height:1.5}
.sheet .ul u{text-underline-offset:3px}
.sig{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:26px;font-size:11px}
.sig div{padding-top:34px}
.sig .ln{border-top:1px solid #000;padding-top:4px}
.legend{margin-top:16px;width:60%!important}
.legend td,.legend th{text-align:center;font-size:10.5px}
/* ---------- Sijil (premium) ---------- */
.cert{width:297mm;height:210mm;background:#fff;margin:0 auto 20px;position:relative;box-shadow:var(--shadow);color:#13292b;overflow:hidden;font-family:'Plus Jakarta Sans',sans-serif}
.cert .bgpat{position:absolute;inset:0;width:100%;height:100%;opacity:.55}
.cert .band{position:absolute;inset:4mm;border:1.6mm solid #0b3d40;background:linear-gradient(#0000,#0000)}
.cert .band:after{content:"";position:absolute;inset:1mm;border:1.2px solid #d8b25a}
.cert .fr{position:absolute;inset:11mm;border:2px solid #b8892a;border-radius:2px}
.cert .fr:after{content:"";position:absolute;inset:2mm;border:.6px solid #b8892a}
.cert .orn{position:absolute;width:26mm;height:26mm}
.cert .wm{position:absolute;left:50%;top:54%;transform:translate(-50%,-50%);width:120mm;height:120mm;opacity:.06;object-fit:contain;filter:grayscale(1)}
.cert .in{position:absolute;inset:19mm 44mm 40mm;text-align:center;display:flex;flex-direction:column;align-items:center}
.cert .logo-img{width:24mm;height:24mm;object-fit:contain;margin-bottom:2mm}
.cert .sch{font-weight:800;letter-spacing:.22em;font-size:13px;color:#0b3d40;text-transform:uppercase}
.cert .addr{font-size:10px;color:#6b7f80;letter-spacing:.08em}
.cert .ttl{font-family:Fraunces;font-weight:900;font-size:32px;letter-spacing:.02em;margin:3mm 0 0;background:linear-gradient(180deg,#0b3d40,#147a72);-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1.05}
.cert .sub{display:flex;align-items:center;gap:4mm;font-size:11.5px;letter-spacing:.32em;color:#a87a1f;font-weight:800;margin-top:2mm}
.cert .sub:before,.cert .sub:after{content:"";width:22mm;height:1px;background:linear-gradient(90deg,transparent,#b8892a,transparent)}
.cert .txt{font-size:12.5px;max-width:205mm;line-height:1.6;color:#33494b}
.cert .nm{font-family:'Great Vibes',cursive;font-size:48px;max-width:235mm;color:#0b3d40;margin:0;line-height:1.15;padding:0 8mm 1mm;border-bottom:1px solid #d8b25a}
.cert .award{display:inline-block;margin:0 2px;padding:1px 10px;border-radius:99px;background:linear-gradient(135deg,#f6dc8e,#c9962b 55%,#8a6414);color:#fff;font-weight:900;letter-spacing:.12em;font-size:11px;text-shadow:0 1px 0 rgba(0,0,0,.2)}
.cert table{border-collapse:separate;border-spacing:0;margin:6mm auto 0;font-size:12px;width:230mm;border:1px solid #d9c9a0;border-radius:6px;overflow:hidden;background:#fff}
.cert td{padding:6px 10px;text-align:left;border-bottom:1px solid #eee3c8}
.cert tr:nth-child(odd) td{background:rgba(247,236,210,.28)}
.cert td.c{text-align:center;font-weight:900;color:#fff;width:13mm}
.cert td.c span{display:inline-block;min-width:11mm;border-radius:4px;padding:1px 0;background:#0b3d40}
.cert td.gap{width:4mm;background:#fff!important;border:0}
.cert .seal{position:absolute;right:24mm;top:20mm;width:32mm;height:32mm}
.cert .sigs{position:absolute;left:32mm;right:32mm;bottom:19mm;display:flex;justify-content:space-between;align-items:flex-end;font-size:10.5px}
.cert .sigs .s{width:66mm;border-top:1px solid #13292b;padding-top:4px;text-align:center;letter-spacing:.04em}
.cert .sigs .mid{text-align:center;color:#6b7f80;font-size:9.5px;letter-spacing:.1em}
.cert .sigs .mid b{display:block;color:#0b3d40;font-size:11px;letter-spacing:.04em}
.cert .serial{position:absolute;left:0;right:0;text-align:center;bottom:14mm;font-size:7.5px;letter-spacing:.2em;color:#9aa9aa}
/* ---------- Profil prestasi (spider) — latar putih, gaya teknologi ---------- */
.prof{width:297mm;height:210mm;margin:0 auto 20px;position:relative;overflow:hidden;box-shadow:var(--shadow);color:#0f2a2c;font-family:'Plus Jakarta Sans',sans-serif;background:#fff}
.prof .grid-bg{position:absolute;inset:0;background-image:linear-gradient(rgba(15,82,87,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(15,82,87,.07) 1px,transparent 1px);background-size:6mm 6mm}
.prof .grid-bg:after{content:"";position:absolute;inset:6mm;border:.4mm solid rgba(15,82,87,.35);clip-path:polygon(0 0,14mm 0,14mm .6mm,.6mm .6mm,.6mm 14mm,0 14mm,0 100%,14mm 100%,14mm calc(100% - .6mm),.6mm calc(100% - .6mm),.6mm calc(100% - 14mm),0 calc(100% - 14mm),0 0,100% 0,100% 14mm,calc(100% - .6mm) 14mm,calc(100% - .6mm) .6mm,calc(100% - 14mm) .6mm,calc(100% - 14mm) 0,100% 0,100% 100%,calc(100% - 14mm) 100%,calc(100% - 14mm) calc(100% - .6mm),calc(100% - .6mm) calc(100% - .6mm),calc(100% - .6mm) calc(100% - 14mm),100% calc(100% - 14mm),100% 100%,0 100%)}
.prof .hd{position:absolute;left:14mm;right:14mm;top:11mm;display:flex;align-items:center;gap:5mm;border-bottom:.5mm solid #0f5257;padding-bottom:3.5mm}
.prof .hd:after{content:"";position:absolute;left:0;bottom:-1.6mm;width:40mm;height:.8mm;background:#c9962b}
.prof .hd img{width:15mm;height:15mm;object-fit:contain}
.prof .hd .t{font-family:Fraunces;font-weight:900;font-size:24px;color:#0b3d40}
.prof .hd .k{font-size:9.5px;letter-spacing:.28em;color:#a87a1f;font-weight:800;font-family:'JetBrains Mono',monospace}
.prof .hd .r{margin-left:auto;text-align:right;font-size:10px;color:#4a6567;line-height:1.5}
.prof .hd .r b{color:#0b3d40;font-size:13px}
.prof .chart{position:absolute;left:8mm;top:33mm;width:165mm;height:165mm}
.prof .pside{position:absolute;right:14mm;top:35mm;width:108mm;display:flex;flex-direction:column;gap:3.5mm}
.prof .glass{background:#fff;border:.35mm solid #cfe0de;border-radius:2.5mm;padding:3.5mm 4.5mm;position:relative}
.prof .glass:before{content:"";position:absolute;left:-.35mm;top:3mm;bottom:3mm;width:.9mm;border-radius:1mm;background:#0f5257}
.prof .kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:3mm}
.prof .kpi .v{font-family:'JetBrains Mono',monospace;font-weight:800;font-size:23px;color:#0b3d40;line-height:1}
.prof .kpi .l{font-size:8px;letter-spacing:.18em;color:#5b7577;margin-top:1.5mm;font-weight:800}
.prof .kpi.g .v{color:#a87a1f}
.prof .ttlx{font-size:8.5px;letter-spacing:.22em;color:#0f5257;font-weight:800;margin-bottom:2.2mm;font-family:'JetBrains Mono',monospace}
.prof .bars .b{display:grid;grid-template-columns:5mm 1fr 33mm 10mm;align-items:center;gap:2mm;font-size:9.2px;margin:1.5mm 0;color:#163638}
.prof .bars .ix{width:4.4mm;height:4.4mm;border-radius:50%;color:#fff;font-weight:800;font-size:7.5px;display:grid;place-items:center}
.prof .bars .nmx{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.prof .bars .tr{display:grid;grid-template-columns:repeat(6,1fr);gap:.7mm}
.prof .bars .tr i{height:2.6mm;border-radius:.5mm;background:#e8efee}
.prof .bars .n{font-weight:900;text-align:right;font-family:'JetBrains Mono',monospace;font-size:10px}
.prof .ins{font-size:9.5px;line-height:1.6;color:#294a4c}
.prof .ins b{color:#0b3d40}
.prof .ft{position:absolute;left:14mm;right:14mm;bottom:9mm;display:flex;justify-content:space-between;font-size:8px;letter-spacing:.2em;color:#6b8486;font-family:'JetBrains Mono',monospace}
.logo-up{display:flex;gap:14px;align-items:center;border:1.5px dashed var(--line);border-radius:12px;padding:12px;background:#fff}
.logo-up .pv{width:72px;height:72px;border-radius:10px;background:#f4f1ea;display:grid;place-items:center;overflow:hidden;font-size:11px;color:var(--muted);text-align:center}
.logo-up .pv img{width:100%;height:100%;object-fit:contain}
#printArea{display:none}
@media print{
  body{background:#fff}
  .app,.toast,.modal,.loader,#boot,.sync{display:none!important}
  #printArea{display:block}
  .sheet,.cert,.prof{box-shadow:none;margin:0;page-break-after:always;break-after:page}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
@media (max-width:980px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;inset:0 30% 0 0;z-index:40;transform:translateX(-100%);transition:.25s;height:100%}
  .side.open{transform:none}
  .mob{display:inline-flex}
  .main{padding:18px}
  .g4{grid-template-columns:repeat(2,1fr)}.g3,.g2{grid-template-columns:1fr}
  .preview-scale{transform:scale(.45);transform-origin:top left;width:222%}
}
/* ===== TEMA PUTIH BERKACA + BUTANG 3D ===== */
@media screen{
:root{--bg:#f3f6fa;--paper:rgba(255,255,255,.62);--line:rgba(255,255,255,.75);--glass-bd:rgba(15,82,87,.12);
  --shadow:0 18px 40px -18px rgba(15,60,70,.28),inset 0 1px 0 rgba(255,255,255,.9)}
html,body{background:#eef3f8}
body{background:
  radial-gradient(900px 600px at 0% 0%,rgba(20,122,114,.16),transparent 60%),
  radial-gradient(800px 600px at 100% 10%,rgba(201,150,43,.14),transparent 60%),
  radial-gradient(900px 700px at 50% 100%,rgba(90,140,220,.14),transparent 60%),#f4f7fb;background-attachment:fixed}
.side{background:rgba(255,255,255,.55)!important;background-image:none!important;color:var(--ink)!important;
  backdrop-filter:blur(22px) saturate(160%);-webkit-backdrop-filter:blur(22px) saturate(160%);
  border-right:1px solid rgba(255,255,255,.8);box-shadow:8px 0 30px -20px rgba(15,60,70,.3)}
.side *{color:inherit}
.logo .mark{color:#fff!important;background:linear-gradient(145deg,#e0b247,#b07f1c);box-shadow:0 6px 0 #8a6312,0 10px 18px -6px rgba(138,99,18,.6),inset 0 1px 0 rgba(255,255,255,.6)}
.logo b{color:var(--brand)}
.nav button{color:var(--ink-2)!important;transition:all .18s}
.nav button:hover{background:rgba(255,255,255,.7)!important;transform:translateX(3px)}
.nav button.on{background:linear-gradient(180deg,#fff,#eaf3f2)!important;color:var(--brand)!important;
  box-shadow:0 4px 0 rgba(15,82,87,.18),0 10px 20px -10px rgba(15,82,87,.45),inset 0 1px 0 #fff}
.side .who{background:rgba(255,255,255,.6)!important;border:1px solid rgba(255,255,255,.9)}
.card,.modal,.box,.panel{background:rgba(255,255,255,.62)!important;border:1px solid rgba(255,255,255,.85)!important;
  backdrop-filter:blur(18px) saturate(150%);-webkit-backdrop-filter:blur(18px) saturate(150%);box-shadow:var(--shadow)}
input.f,select.f,textarea.f,select.tpsel{background:rgba(255,255,255,.8)!important;border:1px solid var(--glass-bd)!important;
  box-shadow:inset 0 2px 4px rgba(15,60,70,.08)}
table.t th{background:linear-gradient(180deg,#1a6f73,#0f5257)!important}
table.t td{border-bottom:1px solid rgba(15,82,87,.08)}
table.t tr:hover td{background:rgba(255,255,255,.7)}
/* Butang 3D */
.btn{position:relative;border:1px solid rgba(15,82,87,.15)!important;color:var(--ink)!important;
  background:linear-gradient(180deg,#ffffff 0%,#eef3f6 100%)!important;
  box-shadow:0 5px 0 #c9d5dc,0 10px 18px -8px rgba(15,60,70,.35),inset 0 1px 0 #fff;
  transform:translateY(0);transition:transform .12s ease,box-shadow .12s ease,filter .2s}
.btn::after{content:"";position:absolute;inset:1px 1px 50% 1px;border-radius:inherit;pointer-events:none;
  background:linear-gradient(180deg,rgba(255,255,255,.55),rgba(255,255,255,0))}
.btn:hover{transform:translateY(-2px);filter:brightness(1.03);
  box-shadow:0 7px 0 #c9d5dc,0 16px 24px -10px rgba(15,60,70,.4),inset 0 1px 0 #fff}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #c9d5dc,0 4px 8px -4px rgba(15,60,70,.3),inset 0 2px 4px rgba(0,0,0,.08)}
.btn.pri{color:#fff!important;border-color:#0b4145!important;background:linear-gradient(180deg,#1f8f86 0%,#0f5257 100%)!important;
  box-shadow:0 5px 0 #083a3d,0 12px 20px -8px rgba(15,82,87,.6),inset 0 1px 0 rgba(255,255,255,.35)}
.btn.pri:hover{box-shadow:0 7px 0 #083a3d,0 18px 26px -10px rgba(15,82,87,.65),inset 0 1px 0 rgba(255,255,255,.35)}

<div id="boot">

    <div class="ld-info">
      <div class="ld-title">e-PBD PPKI • ENJIN SEGERAK DATA</div>
      <div class="ld-msg" id="ldMsg">Menyambung ke pelayan selamat…</div>
      <div class="ld-bar"><i id="ldBar"></i></div>
      <div class="ld-stats"><span>⇣ <b id="ldRate">0.0</b> MB/s</span><span>PAKET <b id="ldPk">0</b></span><span>LATENSI <b id="ldLat">--</b> ms</span></div>

    </div>

<div class="toast" id="toast"></div>

<script>

/* ====================== ENJIN SEGERAK (SKRIN LOADING) ====================== */
const Boot = (() => {
  const STAGES = ['Menyambung ke pelayan selamat…','Mengesahkan sesi pengguna…','Menyedut data sekolah…','Menyegerak rekod murid & prestasi…','Menyusun tafsiran & analisis…','Memuktamadkan paparan…'];
  const TAGS = ['MURID','MARKAH','KELAS','TP','ANALISIS','SIJIL','TETAPAN','MP'];
  let el, cv, ctx, W=0, H=0, cx=0, cy=0, R=0, parts=[], raf=0, last=0, start=0, prog=0, target=0, active=false, fin=null, nextStat=0, pk=0, stage=-1;
  const $i = id => document.getElementById(id);
  const hex = n => Math.floor(Math.random()*16**n).toString(16).toUpperCase().padStart(n,'0');
  function size(){
    const d = Math.min(2, window.devicePixelRatio||1); W = innerWidth; H = innerHeight;
    cv.width = W*d; cv.height = H*d; ctx.setTransform(d,0,0,d,0,0);
    const r = $i('ldCore').getBoundingClientRect(); cx = r.left + r.width/2; cy = r.top + r.height/2; R = Math.hypot(Math.max(cx,W-cx), Math.max(cy,H-cy)) + 40;
    const want = Math.round(Math.min(220, Math.max(70, W*H/7000)) * (matchMedia('(prefers-reduced-motion: reduce)').matches ? .35 : 1));
    while (parts.length < want) parts.push(spawn(true)); parts.length = want;
  }
  function spawn(any){ return { a: Math.random()*Math.PI*2, r: any ? 60 + Math.random()*R : R + Math.random()*60, v: 2.5 + Math.random()*5, w: .6 + Math.random()*1.8,
    gold: Math.random() < .16, sw: (Math.random()<.5?-1:1) * (.002 + Math.random()*.006) }; }
  function frame(t){
    if (!active) return;
    const dt = Math.min(48, t - (last||t)); last = t; const k = dt/16.7;
    const armed = !!(fin && fin.armed);
    if (!armed) target = 93 * (1 - Math.exp(-(t - start)/2400));
    prog += (target - prog) * Math.min(1, (armed ? .2 : .06) * k);
    // jejak lut sinar -> kesan kelajuan
    ctx.globalCompositeOperation = 'destination-out'; ctx.fillStyle = 'rgba(0,0,0,.28)'; ctx.fillRect(0,0,W,H);
    ctx.globalCompositeOperation = 'lighter';
    const boost = armed ? 2.4 : 1 + prog/90;
    for (const p of parts) {
      const x0 = cx + Math.cos(p.a)*p.r, y0 = cy + Math.sin(p.a)*p.r;
      const acc = 1 + (1 - Math.min(1, p.r/R)) * 3.2;
      p.r -= p.v * acc * boost * k; p.a += p.sw * acc * k;
      if (p.r < 48) { Object.assign(p, spawn(false)); pk++; continue; }
      const x1 = cx + Math.cos(p.a)*p.r, y1 = cy + Math.sin(p.a)*p.r;
      const al = Math.min(1, (1 - p.r/R) * 1.6);
      ctx.strokeStyle = p.gold ? `rgba(232,193,58,${al})` : `rgba(94,234,212,${al})`; ctx.lineWidth = p.w;
      ctx.beginPath(); ctx.moveTo(x0,y0); ctx.lineTo(x1,y1); ctx.stroke();
    }
    const pc = Math.min(100, prog);
    $i('ldPct').textContent = Math.floor(pc); $i('ldBar').style.width = pc.toFixed(2) + '%';
    const s = armed && pc > 99.4 ? STAGES.length : Math.min(STAGES.length-1, Math.floor(pc / (96/STAGES.length)));
    if (s !== stage) { stage = s; $i('ldMsg').textContent = s >= STAGES.length ? 'Data berjaya disegerakkan ✓' : STAGES[s]; }
    if (t > nextStat) {
      nextStat = t + 110;
      $i('ldRate').textContent = ((60 + Math.random()*70) * boost).toFixed(1);
      $i('ldPk').textContent = (pk*37 + Math.floor(Math.random()*37)).toLocaleString('en');
      $i('ldLat').textContent = 8 + Math.floor(Math.random()*18);
      const log = $i('ldLog'); const d = document.createElement('div');
      d.innerHTML = `0x${hex(4)} ▸ <span>${TAGS[Math.floor(Math.random()*TAGS.length)]}</span>[${hex(3)}] ▸ ${hex(8)} ▸ OK`;
      log.appendChild(d); while (log.children.length > 4) log.removeChild(log.firstChild);
    }
    if (armed && pc > 99.4 && !fin.done) { fin.done = true; $i('ldPct').textContent = '100'; setTimeout(close, 180); }
    raf = requestAnimationFrame(frame);
  }
  function close(){
    el.classList.add('out');
    setTimeout(() => { const f = fin; fin = null; if (f) f.res(); if (!el.classList.contains('out')) return; active = false; cancelAnimationFrame(raf); el.style.display = 'none'; ctx.clearRect(0,0,W,H); }, 500);
  }
  return {
    show(){
      el = el || $i('boot'); cv = cv || $i('ldCv'); ctx = ctx || cv.getContext('2d');
      if (active && !fin && !el.classList.contains('out')) return;
      if (fin) { const f = fin; fin = null; f.res(); }
      el.style.display = 'grid'; el.classList.remove('out'); void el.offsetWidth;
      if (!active) { active = true; prog = 0; target = 0; stage = -1; pk = 0; start = performance.now(); last = 0; parts = []; size(); raf = requestAnimationFrame(frame); }
    },
    /* lengkapkan ke 100% dengan lancar, kemudian pudar. minMs = masa paparan minimum */
    done(minMs = 600){
      if (!active) return Promise.resolve();
      if (fin) return fin.p;
      let res; const p = new Promise(r => res = r);
      fin = { p, res, done: false, armed: false };
      const arm = () => { if (fin && fin.p === p) { fin.armed = true; target = 100; } };
      const wait = start + minMs - performance.now(); if (wait > 0) setTimeout(arm, wait); else arm();
      return p;
    },
    hide(){ if (!active) return; el.classList.add('out'); const f = fin; fin = null; if (f) f.res();
      setTimeout(() => { if (!el.classList.contains('out')) return; active = false; cancelAnimationFrame(raf); el.style.display = 'none'; }, 500); },
    isActive: () => active,
    resize(){ if (active) size(); }
  };
})();

function penyataan(stu, mp, rec){
  const n = tpNum(rec&&rec.TP_KESELURUHAN); const tf = tafsiranFor(mp.KOD_MP); const parts=[];
  if(n && tf && tf['TP'+n]) parts.push(`${stu.NAMA_RINGKAS||''} ${tf['TP'+n]}`.trim());
  if(rec && rec.ULASAN_GURU_MP) parts.push(rec.ULASAN_GURU_MP);
  return parts.join('\n') || (n?'':'Tidak Berkenaan');
}
function reportRows(stu){ // seperti makro asal: sembunyi mata pelajaran tanpa TP
  return subjects().map(mp=>({mp,rec:mk(stu.ID_MURID,mp.KOD_MP)})).filter(x=>x.rec&&tpNum(x.rec.TP_KESELURUHAN));
}

/* ---------- Kehadiran serentak: amaran jika guru lain membuka halaman yang sama ---------- */
const HADIR_SID = sessionStorage.getItem('pbd_sid') || (()=>{ const s=Math.random().toString(36).slice(2)+Date.now().toString(36); sessionStorage.setItem('pbd_sid',s); return s; })();
const HADIR_PAGES = ['murid','markah','ulasan','kelas','mp','tafsiran','tetapan','akaun']; // halaman yang boleh mengubah data
const hadirPage = () => (S.token && HADIR_PAGES.includes(S.view)) ? (S.sekolah||'')+'|'+(S.kelas||'')+'|'+S.view : '';
let hadirLast='', hadirTimer=null, hadirNama='';
async function hadir(force){
  const page=hadirPage(); if(!force && page===hadirLast && hadirTimer) return; hadirLast=page;
  clearTimeout(hadirTimer); hadirTimer=setTimeout(()=>hadir(true), 20000);
  if(!S.token || document.hidden) { if(!page) showHadir([]); return; }
  try{
    const j=await post({action:'hadir',emel:S.emel,token:S.token,sekolah:S.sekolah,sid:HADIR_SID,page});
    if(j.ok && hadirPage()===page) showHadir(j.lain||[]);
  }catch(e){}
}
function showHadir(lain){
  let el=$('#hadirBar');
  if(!el){ el=document.createElement('div'); el.id='hadirBar'; el.className='hadir-bar'; document.body.appendChild(el); }
  const nama=[...new Set(lain.map(x=>x.nama))];
  if(!nama.length){ el.classList.remove('show'); hadirNama=''; return; }
  const sen=nama.join(', ');
  el.innerHTML=`<span class="hadir-dot"></span><div><b>${esc(sen)}</b> sedang membuka halaman ini juga.<br><span style="opacity:.85">Elakkan mengemaskini data yang sama serentak — tunggu sehingga mereka selesai, kemudian tekan ⟳ Muat semula.</span></div><button class="btn sm" onclick="this.parentNode.classList.remove('show')">Faham</button>`;
  el.classList.add('show');
  if(sen!==hadirNama) toast('⚠ '+sen+' sedang membuka halaman yang sama', true);
  hadirNama=sen;
}
document.addEventListener('visibilitychange',()=>{ if(!document.hidden) hadir(true); });
window.addEventListener('pagehide',()=>{ if(S.token) try{ navigator.sendBeacon(WEB_APP_URL, new Blob([JSON.stringify({action:'hadir',emel:S.emel,token:S.token,sekolah:S.sekolah,sid:HADIR_SID,page:''})],{type:'text/plain;charset=utf-8'})); }catch(e){} });

function saveAkaun(btn){
  const d={}; ['NAMA_GURU','KOD_SEKOLAH','NO_TELEFON','KATA_LALUAN','STATUS'].forEach(k=>d[k]=$('#u'+k).value.trim());
  d.KOD_SEKOLAH=d.KOD_SEKOLAH.toUpperCase().replace(/\s+/g,'');
  if(d.KATA_LALUAN && d.KATA_LALUAN.length<6) return toast('Kata laluan baharu sekurang-kurangnya 6 aksara',true);
  if(!/^[A-Z]{3}[0-9]{4}$/.test(d.KOD_SEKOLAH)) return toast('Kod sekolah tidak sah (contoh: JBA6041)',true);
  if(!d.KATA_LALUAN) delete d.KATA_LALUAN;
  run(btn,async()=>{ await api('kemaskiniAkaun',{id:btn.dataset.e,data:d}); closeModal(); },'Akaun dikemas kini ✓');
}
function padamAkaun(emel){ if(confirm('Padam akaun '+emel+'? Data sekolah tidak terjejas.')) run(null,async()=>{ await api('padamAkaun',{id:emel}); closeModal(); },'Akaun dipadam'); }
function exportAkaun(){
  const cols=['KOD_SEKOLAH','NAMA_GURU','EMEL','NO_TELEFON','KATA_LALUAN','STATUS','DIDAFTAR','LOG_MASUK_AKHIR'];
  const rows=[cols].concat((S.data.akaun||[]).map(a=>cols.map(k=>a[k]??'')));
  const csv='\ufeff'+rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
  const el=document.createElement('a'); el.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'})); el.download='Akaun_Pengguna_ePBD.csv'; el.click();
}

const titleCase = v => String(v||"").toLowerCase().replace(/\s+/g," ").trim().replace(/(^|[\s\/(\-])([a-z])/g,(m,a,b)=>a+b.toUpperCase());

const ORN = (rot,pos) => `<svg class="orn" style="${pos};transform:rotate(${rot}deg)" viewBox="0 0 100 100"><g fill="none" stroke="#b8892a" stroke-width="1.6"><path d="M4 60V4h56"/><path d="M12 44V12h32"/><path d="M4 4l20 20"/><circle cx="24" cy="24" r="5" fill="#d8b25a" stroke="none"/><path d="M30 12c10 0 18 8 18 18M12 30c0 10 8 18 18 18" stroke-width="1"/></g></svg>`;
const GUILLOCHE = (()=>{ let p=''; for(let i=0;i<36;i++){ const a=i*10; p+=`<ellipse cx="0" cy="0" rx="62" ry="22" transform="rotate(${a})"/>`; }
  return `<svg class="bgpat" viewBox="0 0 297 210" preserveAspectRatio="xMidYMid slice"><defs><pattern id="gp" width="14" height="14" patternUnits="userSpaceOnUse"><path d="M0 7Q3.5 0 7 7T14 7" fill="none" stroke="#e9dcb8" stroke-width=".35"/></pattern></defs><rect width="297" height="210" fill="url(#gp)"/><g transform="translate(148.5 112)" fill="none" stroke="#e6d5a6" stroke-width=".25" opacity=".9">${p}</g></svg>`; })();
function sealSVG(t,award){
  let teeth=''; for(let i=0;i<48;i++){const a=i*7.5*Math.PI/180, r=i%2?47:50; teeth+=`${50+r*Math.cos(a)},${50+r*Math.sin(a)} `;}
  return `<svg class="seal" viewBox="0 0 100 100"><defs><linearGradient id="gf" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8e3a0"/><stop offset=".45" stop-color="#c9962b"/><stop offset="1" stop-color="#7d5a12"/></linearGradient>
   <path id="arc" d="M50 50m-33 0a33 33 0 1 1 66 0a33 33 0 1 1 -66 0"/></defs>
   <polygon points="${teeth}" fill="url(#gf)"/><circle cx="50" cy="50" r="40" fill="#0b3d40" stroke="#f3d78a" stroke-width="1.4"/><circle cx="50" cy="50" r="27" fill="none" stroke="#f3d78a" stroke-width=".6" stroke-dasharray="1 1.6"/>
   <text font-size="6.2" font-weight="800" letter-spacing="2.4" fill="#f3d78a" font-family="Plus Jakarta Sans"><textPath href="#arc" startOffset="0">★ PENTAKSIRAN BILIK DARJAH ★ ${esc(t.SESI||'')} </textPath></text>
   <text x="50" y="47" text-anchor="middle" font-family="Fraunces" font-weight="900" font-size="14" fill="#fff">PBD</text>
   <text x="50" y="58" text-anchor="middle" font-size="5.6" font-weight="800" letter-spacing="1" fill="#f3d78a" font-family="Plus Jakarta Sans">${award}</text></svg>`;

const SUBJ_COLORS=['#2563eb','#e11d48','#f59e0b','#10b981','#8b5cf6','#0891b2','#ea580c','#db2777','#65a30d','#0f766e','#7c3aed','#ca8a04'];
const subjColor=i=>SUBJ_COLORS[i%SUBJ_COLORS.length];
function radarSVG(rows){
  const n=rows.length, cx=300, cy=300, R=200, max=6;
  if(n<3) return `<svg viewBox="0 0 600 600"><text x="300" y="300" text-anchor="middle" fill="#4a6567" font-size="18">Perlu sekurang-kurangnya 3 mata pelajaran ber-TP untuk carta labah-labah.</text></svg>`;
  const ang=i=>-Math.PI/2+i*2*Math.PI/n;
  const pt=(i,v)=>[cx+R*v/max*Math.cos(ang(i)), cy+R*v/max*Math.sin(ang(i))];
  const vals=rows.map(r=>tpNum(r.rec.TP_KESELURUHAN));
  let g='';
  // cincin skala
  for(let l=max;l>=1;l--){ g+=`<polygon points="${rows.map((_,i)=>pt(i,l).join(',')).join(' ')}" fill="${l%2?'#f6faf9':'#fff'}" stroke="${l===max?'#0f5257':'#c9dbd9'}" stroke-width="${l===max?1.6:1}" ${l===max?'':'stroke-dasharray="2 4"'}/>`; }
  // jejari berwarna lembut
  rows.forEach((_,i)=>{const [x,y]=pt(i,max); g+=`<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="${subjColor(i)}" stroke-opacity=".35" stroke-width="1.2"/>`;});
  // label skala
  for(let l=1;l<=max;l++){ const [x,y]=pt(0,l); g+=`<rect x="${x+5}" y="${y-8}" width="16" height="14" rx="3" fill="#0f5257"/><text x="${x+13}" y="${y+3}" text-anchor="middle" font-size="10" fill="#fff" font-weight="800" font-family="JetBrains Mono,monospace">${l}</text>`; }
  // segmen berwarna mengikut subjek (kawasan poligon dibahagi)
  const P=vals.map((v,i)=>pt(i,v));
  const mid=(a,b)=>[(a[0]+b[0])/2,(a[1]+b[1])/2];
  P.forEach((p,i)=>{ const pr=P[(i-1+n)%n], nx=P[(i+1)%n]; const m1=mid(pr,p), m2=mid(p,nx);
    g+=`<polygon points="${cx},${cy} ${m1.join(',')} ${p.join(',')} ${m2.join(',')}" fill="${subjColor(i)}" fill-opacity=".30" stroke="none"/>`; });
  // purata
  const avgc=vals.reduce((a,b)=>a+b,0)/n;
  g+=`<polygon points="${rows.map((_,i)=>pt(i,avgc).join(',')).join(' ')}" fill="none" stroke="#c9962b" stroke-width="1.6" stroke-dasharray="6 5"/>`;
  // garis luar
  g+=`<polygon points="${P.map(p=>p.join(',')).join(' ')}" fill="none" stroke="#0b3d40" stroke-width="2.4" stroke-linejoin="round"/>`;
  // garis jejari ke nilai + titik
  P.forEach((p,i)=>{ g+=`<line x1="${cx}" y1="${cy}" x2="${p[0]}" y2="${p[1]}" stroke="${subjColor(i)}" stroke-width="3" stroke-linecap="round"/>`; });
  P.forEach((p,i)=>{ g+=`<circle cx="${p[0]}" cy="${p[1]}" r="11" fill="#fff" stroke="${subjColor(i)}" stroke-width="3"/><text x="${p[0]}" y="${p[1]+4}" text-anchor="middle" font-size="11" font-weight="900" fill="${subjColor(i)}" font-family="JetBrains Mono,monospace">${vals[i]}</text>`; });
  g+=`<circle cx="${cx}" cy="${cy}" r="4" fill="#0b3d40"/>`;
  // label
  rows.forEach((r,i)=>{const a=ang(i); const x=cx+(R+34)*Math.cos(a), y=cy+(R+34)*Math.sin(a);
    const anc=Math.abs(Math.cos(a))<.25?'middle':Math.cos(a)>0?'start':'end';
    const words=titleCase(r.mp.NAMA_MATA_PELAJARAN).replace(/^Asas 3m - /i,'').replace(/^Pendidikan Seni Kesejahteraan \(/i,'(').split(' ');
    const lines=[]; let cur=''; words.forEach(w=>{ if((cur+' '+w).trim().length>18){ if(cur) lines.push(cur); cur=w; } else cur=(cur+' '+w).trim(); }); if(cur) lines.push(cur);
    const ls=lines.slice(0,4); const y0=y-(ls.length-1)*7+(Math.sin(a)>.5?10:Math.sin(a)<-.5?-12:0);
    const bx=anc==='middle'?x:anc==='start'?x+9:x-9; const tx=anc==='middle'?x:anc==='start'?x+22:x-22;
    const by=anc==='middle'?y0-20:y0-4;
    g+=`<circle cx="${anc==='middle'?x:bx}" cy="${by}" r="9" fill="${subjColor(i)}"/><text x="${anc==='middle'?x:bx}" y="${by+3.6}" text-anchor="middle" font-size="10" font-weight="900" fill="#fff">${i+1}</text>`;
    const lx=anc==='middle'?x:tx;
    g+=`<text text-anchor="${anc}" font-size="12.5" font-weight="700" fill="#0f2a2c">${ls.map((l,k)=>`<tspan x="${lx}" y="${y0+k*14}">${esc(l)}</tspan>`).join('')}<tspan x="${lx}" y="${y0+ls.length*14+3}" fill="${subjColor(i)}" font-weight="900" font-size="13.5" font-family="JetBrains Mono,monospace">TP ${vals[i]}</tspan></text>`;});
  return `<svg viewBox="-95 -20 790 640" width="100%" height="100%">${g}</svg>`;
}

  <div class="card" style="margin-top:16px"><h3 style="margin-top:0">Cara guna aplikasi ini</h3><ol style="line-height:1.8">
   <li>Daftar akaun guru (nama, emel, kata laluan, no telefon & kod sekolah). Setiap guru menggunakan aplikasi mengikut <b>kod sekolah</b> masing-masing.</li><li>Log masuk menggunakan <b>emel</b> dan <b>kata laluan</b> yang didaftarkan.</li><li>Lengkapkan <b>Tetapan</b> (sekolah, guru, pelaporan, tarikh).</li>
   <li>Tambah/kemaskini <b>Senarai Murid</b> dan <b>Mata Pelajaran</b>.</li><li>Isi <b>Rekod Prestasi</b> setiap mata pelajaran dan <b>Ulasan Guru Kelas</b>.</li>
   <li>Cetak <b>Laporan Murid</b> dan <b>Sijil PBD</b> (satu murid atau semua sekali). Pilih "Save as PDF" untuk simpan PDF.</li><li><b>Tafsiran TP</b> diselaraskan oleh Master Admin sahaja.</li></ol>
   <div class="hint">Lupa kata laluan atau ada sebarang pertanyaan? <span style="display:inline-block;margin-top:6px">${helpWA()}</span></div></div>`;
};

/* ---------- Tetapan ---------- */
V.tetapan = () => {
  const t=T(); const dis=isAdmin()?'':'disabled';
  const F=(k,l,type='text')=>`<div><label class="l">${l}</label><input class="f" type="${type}" id="s_${k}" value="${esc(t[k])}" ${dis}></div>`;
  $('#view').innerHTML = head('Tetapan','Maklumat sekolah dikongsi semua kelas. Kelas, tahun, sesi & guru kelas disimpan untuk kelas yang sedang dibuka sahaja.', isAdmin()?`<button class="btn pri" onclick="saveSet(this)">💾 Simpan Tetapan</button>`:'')+lockNote()+
  `<div class="card"><div class="grid g2">${F('NAMA_SEKOLAH','Nama sekolah')}${F('ALAMAT_SEKOLAH','Alamat sekolah')}${F('NAMA_GURU_KELAS','Nama guru kelas')}${F('KELAS','Kelas')}${F('NAMA_GURU_BESAR','Nama guru besar')}${F('JAWATAN_PENTADBIR','Jawatan pentadbir')}
   <div><label class="l">Pelaporan</label><select class="f" id="s_PELAPORAN" ${dis}>${['PENTAKSIRAN PERTENGAHAN TAHUN','PENTAKSIRAN AKHIR TAHUN'].map(o=>`<option ${t.PELAPORAN===o?'selected':''}>${o}</option>`).join('')}</select></div>
   ${F('TARIKH_PELAPORAN','Tarikh pelaporan','date')}
   <div><label class="l">Jenis sekolah</label><select class="f" id="s_JENIS_SEKOLAH" ${dis}>${['SEK KEB (SK)','SEK JENIS KEB (SJK)','PENDIDIKAN KHAS','INKLUSIF'].map(o=>`<option ${t.JENIS_SEKOLAH===o?'selected':''}>${o}</option>`).join('')}</select></div>
   <div><label class="l">Bahasa laporan</label><select class="f" id="s_BAHASA_LAPORAN" ${dis}>${['SK','SJKC','SJKT'].map(o=>`<option ${lang()===o?'selected':''}>${o}</option>`).join('')}</select></div>
   ${F('TAHUN','Tahun')}<div><label class="l">Tahap kelas ini (mata pelajaran & pentaksiran)</label><select class="f" id="s_TAHAP" ${dis}>${['1','2'].map(o=>`<option value="${o}" ${tahapAktif()===o?'selected':''}>Tahap ${o} (Tahun ${o==='1'?'1–3':'4–6'})</option>`).join('')}</select></div>${F('SESI','Sesi')}${F('TAJUK_SIJIL','Tajuk sijil')}<div><label class="l">Logo sekolah (dipaparkan pada sijil)</label><input type="hidden" id="s_LOGO_URL" value="${esc(t.LOGO_URL)}">
    <div class="logo-up"><div class="pv" id="logoPv">${t.LOGO_URL?`<img src="${esc(t.LOGO_URL)}">`:'Tiada logo'}</div><div style="flex:1">
    ${isAdmin()?`<input type="file" accept="image/*" id="logoFile" onchange="pickLogo(this)" style="display:none"><button class="btn sm pri" type="button" onclick="$('#logoFile').click()">⬆ Muat naik logo</button> <button class="btn sm" type="button" onclick="setLogo('')">✕ Buang</button><div class="hint" style="font-size:12px;margin-top:6px">PNG/JPG. Logo diperkecil automatik. Tekan <b>Simpan Tetapan</b> selepas muat naik.</div>`:'<div class="hint">Log masuk untuk muat naik logo.</div>'}</div></div></div>
   ${isAdmin()&&!isMaster()?`<div><label class="l">Kata laluan akaun anda yang baharu (kosong = kekal)</label><input class="f" type="password" id="s_ADMIN_PASSWORD"></div>`:''}
  </div></div>`;
};
function setLogo(url){ $('#s_LOGO_URL').value=url; $('#logoPv').innerHTML=url?`<img src="${url}">`:'Tiada logo'; }
function pickLogo(inp){
  const f=inp.files[0]; if(!f) return;
  const rd=new FileReader(); rd.onload=()=>{ const im=new Image(); im.onload=()=>{
    let size=360, out='';
    for(let k=0;k<8;k++){ const sc=Math.min(1,size/Math.max(im.width,im.height)); const c=document.createElement('canvas'); c.width=Math.round(im.width*sc); c.height=Math.round(im.height*sc);
      c.getContext('2d').drawImage(im,0,0,c.width,c.height); out=c.toDataURL('image/png'); if(out.length>45000) out=c.toDataURL('image/webp',.85); if(out.length<=45000) break; size=Math.round(size*.8); }
    if(out.length>48000){ toast('Logo terlalu besar, cuba imej lain',true); return; }
    setLogo(out); toast('Logo dimuat naik — tekan Simpan Tetapan ✓');
  }; im.src=rd.result; }; rd.readAsDataURL(f);
}
function saveSet(btn){
  const keys=['NAMA_SEKOLAH','ALAMAT_SEKOLAH','NAMA_GURU_KELAS','KELAS','NAMA_GURU_BESAR','JAWATAN_PENTADBIR','PELAPORAN','TARIKH_PELAPORAN','JENIS_SEKOLAH','BAHASA_LAPORAN','TAHUN','TAHAP','SESI','TAJUK_SIJIL','LOGO_URL','ADMIN_PASSWORD'];
  const d={}; keys.forEach(k=>{const el=$('#s_'+k); if(el) d[k]=el.value.trim();});
  const newPw=d.ADMIN_PASSWORD; if(!newPw) delete d.ADMIN_PASSWORD;
  run(btn,async()=>{ await api('saveTetapan',{data:d}); },'Tetapan disimpan ✓');
}

/* ====================== PWA ====================== */
if('serviceWorker' in navigator && location.protocol==='https:' && window.self===window.top){
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
load();
</script>

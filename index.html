<!DOCTYPE html>
<html lang="ms">
<head>
<script>
const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzwaTgAQ0z67rZgEP3aEiPJ-Nl7b7q3d_CCzMLXc3JZoLZIbuzJ75DYxl4j-vmTuBs/exec";

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>e-PBD • Sistem Pelaporan Pentaksiran Bilik Darjah</title>
<meta name="description" content="Aplikasi pelaporan PBD digital: rekod tahap penguasaan, laporan murid dan sijil PBD.">
<meta name="theme-color" content="#0f5257">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="e-PBD">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,500;9..144,700;9..144,900&family=Great+Vibes&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --ink:#10292b;--ink-2:#3d5a5c;--muted:#7a9294;--bg:#f4f1ea;--paper:#fffdf8;--line:#e3ddd0;
  --brand:#0f5257;--brand-2:#147a72;--brand-soft:#dcefeb;--gold:#c9962b;--gold-soft:#f7ecd2;
  --danger:#b4412f;--ok:#2f7d4f;--warn:#c27d0e;
  --tp1:#d9534f;--tp2:#ee8a3c;--tp3:#e8c13a;--tp4:#8cc152;--tp5:#3aa57a;--tp6:#147a72;
  --r:16px;--shadow:0 10px 30px -12px rgba(16,41,43,.25);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Plus Jakarta Sans',system-ui,sans-serif;font-size:15px}
h1,h2,h3,.serif{font-family:'Fraunces',Georgia,serif;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--brand-2)}
/* ---------- Shell ---------- */
.app{display:grid;grid-template-columns:260px 1fr;min-height:100vh}
.side{background:var(--brand);color:#eaf6f4;padding:22px 16px;position:sticky;top:0;height:100vh;overflow:auto;
  background-image:radial-gradient(circle at 20% 0%,rgba(255,255,255,.12),transparent 40%),radial-gradient(circle at 100% 100%,rgba(201,150,43,.25),transparent 45%)}
.logo{display:flex;gap:12px;align-items:center;margin-bottom:26px}
.logo .mark{width:44px;height:44px;border-radius:12px;background:var(--gold);display:grid;place-items:center;font-family:Fraunces;font-weight:900;color:var(--brand);font-size:20px}
.logo b{font-family:Fraunces;font-size:22px;display:block}
.logo small{opacity:.75;font-size:12px}
.nav button{display:flex;width:100%;gap:12px;align-items:center;padding:11px 14px;border:0;background:none;border-radius:12px;cursor:pointer;color:#d9eeea;font-weight:600;text-align:left;margin-bottom:3px}
.nav button:hover{background:rgba(255,255,255,.08)}
.nav button.on{background:var(--paper);color:var(--brand)}
.nav .ico{width:22px;text-align:center}
.side .btn{color:var(--ink)}
.side .who{margin-top:22px;padding:14px;border-radius:14px;background:rgba(0,0,0,.18);font-size:13px}
.main{padding:26px 34px 60px;min-width:0}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.top h1{margin:0;font-size:30px}
.top p{margin:4px 0 0;color:var(--ink-2)}
.chip{display:inline-flex;gap:6px;align-items:center;padding:6px 12px;border-radius:999px;background:var(--brand-soft);color:var(--brand);font-weight:700;font-size:12px}
.chip.gold{background:var(--gold-soft);color:#8a6312}
.chip.red{background:#f6dcd6;color:var(--danger)}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--shadow)}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}
.stat .n{font-family:Fraunces;font-size:36px;font-weight:900;color:var(--brand)}
.stat .l{color:var(--ink-2);font-size:13px;font-weight:600}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:12px;border:1px solid var(--line);background:var(--paper);cursor:pointer;font-weight:700}
.btn:hover{border-color:var(--brand-2)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.pri:hover{background:var(--brand-2)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#fff}
.btn.danger{color:var(--danger)}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:9px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
input.f,select.f,textarea.f{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff}
input.f:focus,select.f:focus,textarea.f:focus{outline:2px solid var(--brand-soft);border-color:var(--brand-2)}
label.l{font-size:12px;font-weight:700;color:var(--ink-2);display:block;margin:10px 0 5px;text-transform:uppercase;letter-spacing:.04em}
table.t{width:100%;border-collapse:separate;border-spacing:0;font-size:14px}
table.t th{position:sticky;top:0;background:var(--brand);color:#fff;text-align:left;padding:10px;font-size:12px;font-weight:700;vertical-align:bottom}
table.t th:first-child{border-top-left-radius:10px}table.t th:last-child{border-top-right-radius:10px}
table.t td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
table.t tr:hover td{background:#faf6ec}
.tw{overflow:auto;max-height:70vh;border-radius:12px}
.tp{display:inline-grid;place-items:center;min-width:34px;height:28px;border-radius:8px;font-weight:800;color:#fff;font-size:13px;padding:0 6px}
.tp1{background:var(--tp1)}.tp2{background:var(--tp2)}.tp3{background:var(--tp3);color:#4a3a00}.tp4{background:var(--tp4)}.tp5{background:var(--tp5)}.tp6{background:var(--tp6)}.tp0{background:#ddd;color:#777}
select.tpsel{padding:6px;border-radius:8px;border:1px solid var(--line);font-weight:700;width:64px;text-align:center}
.empty{padding:40px;text-align:center;color:var(--muted)}
.toast{position:fixed;right:20px;bottom:20px;background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;box-shadow:var(--shadow);z-index:99;opacity:0;transform:translateY(10px);transition:.25s;max-width:420px}
.toast.show{opacity:1;transform:none}.toast.err{background:var(--danger)}
.modal{position:fixed;inset:0;background:rgba(16,41,43,.55);display:none;place-items:center;z-index:50;padding:16px}
.modal.show{display:grid}
.modal .box{background:var(--paper);border-radius:20px;padding:24px;width:min(640px,100%);max-height:90vh;overflow:auto}
.loader{position:fixed;inset:0;background:var(--bg);display:grid;place-items:center;z-index:100}
.spin{width:46px;height:46px;border:4px solid var(--brand-soft);border-top-color:var(--brand);border-radius:50%;animation:s 1s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
.lock{color:var(--muted);font-size:13px}
.bar{height:10px;border-radius:99px;background:#eee;overflow:hidden;display:flex}
.bar span{display:block;height:100%}
.mob{display:none}
.hint{font-size:13px;color:var(--ink-2);background:var(--gold-soft);border-radius:12px;padding:10px 14px}
/* ---------- Laporan (cetakan) ---------- */
.sheet{background:#fff;color:#000;width:210mm;min-height:297mm;padding:14mm 14mm 12mm;margin:0 auto 20px;box-shadow:var(--shadow);font-family:Arial,Helvetica,sans-serif;font-size:11.5px;position:relative}
.sheet h2{font-family:Arial;text-align:center;font-size:17px;margin:0 0 12px;letter-spacing:.02em}
.sheet .info{display:grid;grid-template-columns:1fr 1fr;gap:3px 20px;margin-bottom:10px}
.sheet .info div b{display:inline-block;min-width:92px}
.sheet table{width:100%;border-collapse:collapse}
.sheet th,.sheet td{border:1px solid #000;padding:6px 7px;vertical-align:middle}
.sheet th{background:#d9e8e6;font-size:11px}
.sheet td.mp{font-weight:700;width:24%}
.sheet td.tpc{text-align:center;font-weight:700;width:12%}
.sheet .ul{margin:12px 0;line-height:1.5}
.sheet .ul u{text-underline-offset:3px}
.sig{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:26px;font-size:11px}
.sig div{padding-top:34px}
.sig .ln{border-top:1px solid #000;padding-top:4px}
.legend{margin-top:16px;width:60%!important}
.legend td,.legend th{text-align:center;font-size:10.5px}
/* ---------- Sijil (premium) ---------- */
.cert{width:297mm;height:210mm;background:#fff;margin:0 auto 20px;position:relative;box-shadow:var(--shadow);color:#13292b;overflow:hidden;font-family:'Plus Jakarta Sans',sans-serif}
.cert .bgpat{position:absolute;inset:0;width:100%;height:100%;opacity:.55}
.cert .band{position:absolute;inset:4mm;border:1.6mm solid #0b3d40;background:linear-gradient(#0000,#0000)}
.cert .band:after{content:"";position:absolute;inset:1mm;border:1.2px solid #d8b25a}
.cert .fr{position:absolute;inset:11mm;border:2px solid #b8892a;border-radius:2px}
.cert .fr:after{content:"";position:absolute;inset:2mm;border:.6px solid #b8892a}
.cert .orn{position:absolute;width:26mm;height:26mm}
.cert .wm{position:absolute;left:50%;top:54%;transform:translate(-50%,-50%);width:120mm;height:120mm;opacity:.06;object-fit:contain;filter:grayscale(1)}
.cert .in{position:absolute;inset:19mm 44mm 40mm;text-align:center;display:flex;flex-direction:column;align-items:center}
.cert .logo-img{width:24mm;height:24mm;object-fit:contain;margin-bottom:2mm}
.cert .sch{font-weight:800;letter-spacing:.22em;font-size:13px;color:#0b3d40;text-transform:uppercase}
.cert .addr{font-size:10px;color:#6b7f80;letter-spacing:.08em}
.cert .ttl{font-family:Fraunces;font-weight:900;font-size:32px;letter-spacing:.02em;margin:3mm 0 0;background:linear-gradient(180deg,#0b3d40,#147a72);-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1.05}
.cert .sub{display:flex;align-items:center;gap:4mm;font-size:11.5px;letter-spacing:.32em;color:#a87a1f;font-weight:800;margin-top:2mm}
.cert .sub:before,.cert .sub:after{content:"";width:22mm;height:1px;background:linear-gradient(90deg,transparent,#b8892a,transparent)}
.cert .txt{font-size:12.5px;max-width:205mm;line-height:1.6;color:#33494b}
.cert .nm{font-family:'Great Vibes',cursive;font-size:48px;max-width:235mm;color:#0b3d40;margin:0;line-height:1.15;padding:0 8mm 1mm;border-bottom:1px solid #d8b25a}
.cert .award{display:inline-block;margin:0 2px;padding:1px 10px;border-radius:99px;background:linear-gradient(135deg,#f6dc8e,#c9962b 55%,#8a6414);color:#fff;font-weight:900;letter-spacing:.12em;font-size:11px;text-shadow:0 1px 0 rgba(0,0,0,.2)}
.cert table{border-collapse:separate;border-spacing:0;margin:6mm auto 0;font-size:12px;width:230mm;border:1px solid #d9c9a0;border-radius:6px;overflow:hidden;background:#fff}
.cert td{padding:6px 10px;text-align:left;border-bottom:1px solid #eee3c8}
.cert tr:nth-child(odd) td{background:rgba(247,236,210,.28)}
.cert td.c{text-align:center;font-weight:900;color:#fff;width:13mm}
.cert td.c span{display:inline-block;min-width:11mm;border-radius:4px;padding:1px 0;background:#0b3d40}
.cert td.gap{width:4mm;background:#fff!important;border:0}
.cert .seal{position:absolute;right:24mm;top:20mm;width:32mm;height:32mm}
.cert .sigs{position:absolute;left:32mm;right:32mm;bottom:19mm;display:flex;justify-content:space-between;align-items:flex-end;font-size:10.5px}
.cert .sigs .s{width:66mm;border-top:1px solid #13292b;padding-top:4px;text-align:center;letter-spacing:.04em}
.cert .sigs .mid{text-align:center;color:#6b7f80;font-size:9.5px;letter-spacing:.1em}
.cert .sigs .mid b{display:block;color:#0b3d40;font-size:11px;letter-spacing:.04em}
.cert .serial{position:absolute;left:0;right:0;text-align:center;bottom:14mm;font-size:7.5px;letter-spacing:.2em;color:#9aa9aa}
/* ---------- Profil prestasi (spider) — latar putih, gaya teknologi ---------- */
.prof{width:297mm;height:210mm;margin:0 auto 20px;position:relative;overflow:hidden;box-shadow:var(--shadow);color:#0f2a2c;font-family:'Plus Jakarta Sans',sans-serif;background:#fff}
.prof .grid-bg{position:absolute;inset:0;background-image:linear-gradient(rgba(15,82,87,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(15,82,87,.07) 1px,transparent 1px);background-size:6mm 6mm}
.prof .grid-bg:after{content:"";position:absolute;inset:6mm;border:.4mm solid rgba(15,82,87,.35);clip-path:polygon(0 0,14mm 0,14mm .6mm,.6mm .6mm,.6mm 14mm,0 14mm,0 100%,14mm 100%,14mm calc(100% - .6mm),.6mm calc(100% - .6mm),.6mm calc(100% - 14mm),0 calc(100% - 14mm),0 0,100% 0,100% 14mm,calc(100% - .6mm) 14mm,calc(100% - .6mm) .6mm,calc(100% - 14mm) .6mm,calc(100% - 14mm) 0,100% 0,100% 100%,calc(100% - 14mm) 100%,calc(100% - 14mm) calc(100% - .6mm),calc(100% - .6mm) calc(100% - .6mm),calc(100% - .6mm) calc(100% - 14mm),100% calc(100% - 14mm),100% 100%,0 100%)}
.prof .hd{position:absolute;left:14mm;right:14mm;top:11mm;display:flex;align-items:center;gap:5mm;border-bottom:.5mm solid #0f5257;padding-bottom:3.5mm}
.prof .hd:after{content:"";position:absolute;left:0;bottom:-1.6mm;width:40mm;height:.8mm;background:#c9962b}
.prof .hd img{width:15mm;height:15mm;object-fit:contain}
.prof .hd .t{font-family:Fraunces;font-weight:900;font-size:24px;color:#0b3d40}
.prof .hd .k{font-size:9.5px;letter-spacing:.28em;color:#a87a1f;font-weight:800;font-family:'JetBrains Mono',monospace}
.prof .hd .r{margin-left:auto;text-align:right;font-size:10px;color:#4a6567;line-height:1.5}
.prof .hd .r b{color:#0b3d40;font-size:13px}
.prof .chart{position:absolute;left:8mm;top:33mm;width:165mm;height:165mm}
.prof .pside{position:absolute;right:14mm;top:35mm;width:108mm;display:flex;flex-direction:column;gap:3.5mm}
.prof .glass{background:#fff;border:.35mm solid #cfe0de;border-radius:2.5mm;padding:3.5mm 4.5mm;position:relative}
.prof .glass:before{content:"";position:absolute;left:-.35mm;top:3mm;bottom:3mm;width:.9mm;border-radius:1mm;background:#0f5257}
.prof .kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:3mm}
.prof .kpi .v{font-family:'JetBrains Mono',monospace;font-weight:800;font-size:23px;color:#0b3d40;line-height:1}
.prof .kpi .l{font-size:8px;letter-spacing:.18em;color:#5b7577;margin-top:1.5mm;font-weight:800}
.prof .kpi.g .v{color:#a87a1f}
.prof .ttlx{font-size:8.5px;letter-spacing:.22em;color:#0f5257;font-weight:800;margin-bottom:2.2mm;font-family:'JetBrains Mono',monospace}
.prof .bars .b{display:grid;grid-template-columns:5mm 1fr 33mm 10mm;align-items:center;gap:2mm;font-size:9.2px;margin:1.5mm 0;color:#163638}
.prof .bars .ix{width:4.4mm;height:4.4mm;border-radius:50%;color:#fff;font-weight:800;font-size:7.5px;display:grid;place-items:center}
.prof .bars .nmx{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.prof .bars .tr{display:grid;grid-template-columns:repeat(6,1fr);gap:.7mm}
.prof .bars .tr i{height:2.6mm;border-radius:.5mm;background:#e8efee}
.prof .bars .n{font-weight:900;text-align:right;font-family:'JetBrains Mono',monospace;font-size:10px}
.prof .ins{font-size:9.5px;line-height:1.6;color:#294a4c}
.prof .ins b{color:#0b3d40}
.prof .ft{position:absolute;left:14mm;right:14mm;bottom:9mm;display:flex;justify-content:space-between;font-size:8px;letter-spacing:.2em;color:#6b8486;font-family:'JetBrains Mono',monospace}
.logo-up{display:flex;gap:14px;align-items:center;border:1.5px dashed var(--line);border-radius:12px;padding:12px;background:#fff}
.logo-up .pv{width:72px;height:72px;border-radius:10px;background:#f4f1ea;display:grid;place-items:center;overflow:hidden;font-size:11px;color:var(--muted);text-align:center}
.logo-up .pv img{width:100%;height:100%;object-fit:contain}
#printArea{display:none}
@media print{
  body{background:#fff}
  .app,.toast,.modal,.loader{display:none!important}
  #printArea{display:block}
  .sheet,.cert,.prof{box-shadow:none;margin:0;page-break-after:always;break-after:page}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
@media (max-width:980px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;inset:0 30% 0 0;z-index:40;transform:translateX(-100%);transition:.25s;height:100%}
  .side.open{transform:none}
  .mob{display:inline-flex}
  .main{padding:18px}
  .g4{grid-template-columns:repeat(2,1fr)}.g3,.g2{grid-template-columns:1fr}
  .preview-scale{transform:scale(.45);transform-origin:top left;width:222%}
}
/* ===== TEMA PUTIH BERKACA + BUTANG 3D ===== */
@media screen{
:root{--bg:#f3f6fa;--paper:rgba(255,255,255,.62);--line:rgba(255,255,255,.75);--glass-bd:rgba(15,82,87,.12);
  --shadow:0 18px 40px -18px rgba(15,60,70,.28),inset 0 1px 0 rgba(255,255,255,.9)}
html,body{background:#eef3f8}
body{background:
  radial-gradient(900px 600px at 0% 0%,rgba(20,122,114,.16),transparent 60%),
  radial-gradient(800px 600px at 100% 10%,rgba(201,150,43,.14),transparent 60%),
  radial-gradient(900px 700px at 50% 100%,rgba(90,140,220,.14),transparent 60%),#f4f7fb;background-attachment:fixed}
.side{background:rgba(255,255,255,.55)!important;background-image:none!important;color:var(--ink)!important;
  backdrop-filter:blur(22px) saturate(160%);-webkit-backdrop-filter:blur(22px) saturate(160%);
  border-right:1px solid rgba(255,255,255,.8);box-shadow:8px 0 30px -20px rgba(15,60,70,.3)}
.side *{color:inherit}
.logo .mark{color:#fff!important;background:linear-gradient(145deg,#e0b247,#b07f1c);box-shadow:0 6px 0 #8a6312,0 10px 18px -6px rgba(138,99,18,.6),inset 0 1px 0 rgba(255,255,255,.6)}
.logo b{color:var(--brand)}
.nav button{color:var(--ink-2)!important;transition:all .18s}
.nav button:hover{background:rgba(255,255,255,.7)!important;transform:translateX(3px)}
.nav button.on{background:linear-gradient(180deg,#fff,#eaf3f2)!important;color:var(--brand)!important;
  box-shadow:0 4px 0 rgba(15,82,87,.18),0 10px 20px -10px rgba(15,82,87,.45),inset 0 1px 0 #fff}
.side .who{background:rgba(255,255,255,.6)!important;border:1px solid rgba(255,255,255,.9)}
.card,.modal,.box,.panel{background:rgba(255,255,255,.62)!important;border:1px solid rgba(255,255,255,.85)!important;
  backdrop-filter:blur(18px) saturate(150%);-webkit-backdrop-filter:blur(18px) saturate(150%);box-shadow:var(--shadow)}
input.f,select.f,textarea.f,select.tpsel{background:rgba(255,255,255,.8)!important;border:1px solid var(--glass-bd)!important;
  box-shadow:inset 0 2px 4px rgba(15,60,70,.08)}
table.t th{background:linear-gradient(180deg,#1a6f73,#0f5257)!important}
table.t td{border-bottom:1px solid rgba(15,82,87,.08)}
table.t tr:hover td{background:rgba(255,255,255,.7)}
/* Butang 3D */
.btn{position:relative;border:1px solid rgba(15,82,87,.15)!important;color:var(--ink)!important;
  background:linear-gradient(180deg,#ffffff 0%,#eef3f6 100%)!important;
  box-shadow:0 5px 0 #c9d5dc,0 10px 18px -8px rgba(15,60,70,.35),inset 0 1px 0 #fff;
  transform:translateY(0);transition:transform .12s ease,box-shadow .12s ease,filter .2s}
.btn::after{content:"";position:absolute;inset:1px 1px 50% 1px;border-radius:inherit;pointer-events:none;
  background:linear-gradient(180deg,rgba(255,255,255,.55),rgba(255,255,255,0))}
.btn:hover{transform:translateY(-2px);filter:brightness(1.03);
  box-shadow:0 7px 0 #c9d5dc,0 16px 24px -10px rgba(15,60,70,.4),inset 0 1px 0 #fff}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #c9d5dc,0 4px 8px -4px rgba(15,60,70,.3),inset 0 2px 4px rgba(0,0,0,.08)}
.btn.pri{color:#fff!important;border-color:#0b4145!important;background:linear-gradient(180deg,#1f8f86 0%,#0f5257 100%)!important;
  box-shadow:0 5px 0 #083a3d,0 12px 20px -8px rgba(15,82,87,.6),inset 0 1px 0 rgba(255,255,255,.35)}
.btn.pri:hover{box-shadow:0 7px 0 #083a3d,0 18px 26px -10px rgba(15,82,87,.65),inset 0 1px 0 rgba(255,255,255,.35)}
.btn.pri:active{box-shadow:0 1px 0 #083a3d,0 4px 8px -4px rgba(15,82,87,.5)}
.btn.gold{color:#fff!important;border-color:#8a6312!important;background:linear-gradient(180deg,#e6b94d 0%,#b8851f 100%)!important;
  box-shadow:0 5px 0 #7a560f,0 12px 20px -8px rgba(138,99,18,.6),inset 0 1px 0 rgba(255,255,255,.45)}
.btn.gold:hover{box-shadow:0 7px 0 #7a560f,0 18px 26px -10px rgba(138,99,18,.6),inset 0 1px 0 rgba(255,255,255,.45)}
.btn.gold:active{box-shadow:0 1px 0 #7a560f}
.btn.danger{color:var(--danger)!important;box-shadow:0 5px 0 #e9c4bc,0 10px 18px -8px rgba(180,65,47,.35),inset 0 1px 0 #fff}
.btn.sm{box-shadow:0 3px 0 #c9d5dc,0 6px 12px -6px rgba(15,60,70,.35),inset 0 1px 0 #fff}
.btn.sm.pri{box-shadow:0 3px 0 #083a3d,0 6px 12px -6px rgba(15,82,87,.5)}
.btn.sm:active{transform:translateY(2px)}
.btn:disabled{transform:none!important;filter:grayscale(.4)}
.chip{background:rgba(255,255,255,.7)!important;border:1px solid rgba(15,82,87,.15);backdrop-filter:blur(8px)}
.tp{box-shadow:0 3px 0 rgba(0,0,0,.18),inset 0 1px 0 rgba(255,255,255,.4)}
}
</style>
</head>
<body>
<div class="loader" id="loader"><div style="text-align:center"><div class="spin" style="margin:auto"></div><p class="serif" style="margin-top:16px;color:var(--brand)">Memuatkan data dari Google Sheet…</p></div></div>

<div class="app">
  <aside class="side" id="side">
    <div class="logo"><div class="mark">P</div><div><b>e-PBD</b><small>Pelaporan Pentaksiran Bilik Darjah</small></div></div>
    <nav class="nav" id="nav"></nav>
    <div class="who" id="who"></div>
  </aside>
  <main class="main">
    <div class="row" style="margin-bottom:10px"><button class="btn sm mob" onclick="side.classList.toggle('open')">☰ Menu</button></div>
    <div id="view"></div>
  </main>
</div>

<div id="printArea"></div>
<div class="modal" id="modal"><div class="box" id="modalBox"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ====================== STATE ====================== */
const S = { data:null, view:'dash', pass:sessionStorage.getItem('pbd_pw')||'', kelas:localStorage.getItem('pbd_kelas')||'', mpSel:null, stuSel:null, charts:[] };
const NAV = [
  ['dash','◎','Papan Pemuka'],['kelas','🗓','Kelas & Tahun'],['murid','👥','Senarai Murid'],['markah','✎','Rekod Prestasi'],
  ['ulasan','💬','Ulasan Guru Kelas'],['laporan','📄','Laporan Murid'],['sijil','🏅','Sijil PBD'],
  ['analisis','📊','Analisis & Graf'],['mp','📚','Mata Pelajaran'],['tafsiran','🗂','Tafsiran TP'],
  ['panduan','📘','Panduan'],['tetapan','⚙','Tetapan']
];
const $ = s => document.querySelector(s);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const isAdmin = () => !!S.pass;
function toast(msg, err){ const t=$('#toast'); t.textContent=msg; t.className='toast show'+(err?' err':''); clearTimeout(t._h); t._h=setTimeout(()=>t.className='toast',3200); }

/* ====================== API ====================== */
const URL_OK = () => WEB_APP_URL && WEB_APP_URL.startsWith('https://');
async function load(){
  try{
    if(!URL_OK()) throw new Error('Web App URL belum ditetapkan di baris ke-5 index.html');
    let j = await (await fetch(WEB_APP_URL+'?action=getAll&kelas='+encodeURIComponent(S.kelas)+'&t='+Date.now())).json();
    if(!j.ok && S.kelas && /tidak dijumpai/i.test(j.error)){ S.kelas=''; j = await (await fetch(WEB_APP_URL+'?action=getAll&t='+Date.now())).json(); }
    if(!j.ok) throw new Error(j.error);
    setData(j.data);
  }catch(e){
    const c = localStorage.getItem('pbd_cache_'+S.kelas) || localStorage.getItem('pbd_cache');
    if(c){ S.data = JSON.parse(c); toast('Mod luar talian: memaparkan data simpanan terakhir. ('+e.message+')', true); }
    else { $('#loader').innerHTML = `<div class="card" style="max-width:520px"><h2>Tidak dapat sambung</h2><p>${esc(e.message)}</p><p class="hint">Pastikan Web App URL di baris ke-5 index.html betul dan deployment Apps Script ditetapkan kepada <b>Anyone</b>.</p><button class="btn pri" onclick="location.reload()">Cuba lagi</button></div>`; return; }
  }
  $('#loader').style.display='none'; render();
}
async function api(action, payload={}){
  if(!isAdmin()){ askLogin(); throw new Error('Perlu log masuk admin'); }
  const r = await fetch(WEB_APP_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action,password:S.pass,kelas:S.kelas,...payload})});
  const j = await r.json();
  if(!j.ok){ if(/kata laluan/i.test(j.error)){ logout(); } throw new Error(j.error); }
  if(j.data) setData(j.data);
  return j;
}
function setData(d){
  S.data=d; if(d.kelasAktif){ S.kelas=d.kelasAktif.ID_KELAS; localStorage.setItem('pbd_kelas',S.kelas); }
  try{ localStorage.setItem('pbd_cache_'+S.kelas, JSON.stringify(d)); localStorage.setItem('pbd_cache', JSON.stringify(d)); }catch(e){}
}
async function switchKelas(id){
  if(!id || id===S.kelas) return; S.kelas=id; S.stuSel=null; S.mpSel=null; localStorage.setItem('pbd_kelas',id);
  $('#loader').style.display='grid'; await load();
}
const kelasList = () => (S.data.senaraiKelas||[]).slice().sort((a,b)=>(+b.SESI||0)-(+a.SESI||0)||String(a.TAHUN).localeCompare(String(b.TAHUN))||String(a.NAMA_KELAS).localeCompare(String(b.NAMA_KELAS)));
const kelasLabel = k => `${k.TAHUN?k.TAHUN+' ':''}${k.NAMA_KELAS}`;
const isArkib = () => { const k=S.data.kelasAktif; if(!k) return false; const latest=Math.max(...kelasList().map(x=>+x.SESI||0)); return String(k.STATUS).toUpperCase()==='ARKIB' || (+k.SESI||0)<latest; };
function kelasPicker(){
  const ks=kelasList(); if(!ks.length) return '';
  const years=[...new Set(ks.map(k=>String(k.SESI)))];
  return `<select class="f" style="margin:6px 0 10px;font-weight:700" onchange="switchKelas(this.value)">${years.map(y=>`<optgroup label="Sesi ${esc(y)}">${ks.filter(k=>String(k.SESI)===y).map(k=>`<option value="${esc(k.ID_KELAS)}" ${k.ID_KELAS===S.kelas?'selected':''}>${esc(kelasLabel(k))}${String(k.STATUS).toUpperCase()==='ARKIB'?' (arkib)':''}</option>`).join('')}</optgroup>`).join('')}</select>`;
}
async function run(btn, fn, okMsg){
  const old = btn && btn.innerHTML; if(btn){btn.disabled=true;btn.innerHTML='⏳ Menyimpan…';}
  try{ await fn(); toast(okMsg||'Berjaya disimpan ✓'); render(); }
  catch(e){ toast(e.message,true); }
  finally{ if(btn){btn.disabled=false;btn.innerHTML=old;} }
}

/* ====================== AUTH ====================== */
function askLogin(){
  openModal(`<h2 style="margin-top:0">🔐 Log Masuk Admin</h2><p class="lock">Hanya admin boleh menambah murid, mata pelajaran dan mengisi rekod.</p>
  <label class="l">Kata laluan</label><input type="password" class="f" id="pw" autofocus onkeydown="if(event.key==='Enter')doLogin(this)">
  <div class="row" style="margin-top:16px"><span class="sp"></span><button class="btn" onclick="closeModal()">Batal</button><button class="btn pri" onclick="doLogin(this)">Log Masuk</button></div>`);
  setTimeout(()=>$('#pw')&&$('#pw').focus(),50);
}
async function doLogin(btn){
  const pw = $('#pw').value; if(!pw) return;
  btn.disabled=true;
  try{
    const r = await fetch(WEB_APP_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'login',password:pw})});
    const j = await r.json(); if(!j.ok) throw new Error(j.error);
    S.pass=pw; sessionStorage.setItem('pbd_pw',pw); closeModal(); toast('Selamat datang, Admin ✓'); render();
  }catch(e){ toast(e.message,true); btn.disabled=false; }
}
function logout(){ S.pass=''; sessionStorage.removeItem('pbd_pw'); render(); }
function openModal(h){ $('#modalBox').innerHTML=h; $('#modal').classList.add('show'); }
function closeModal(){ $('#modal').classList.remove('show'); }
$('#modal').addEventListener('click',e=>{ if(e.target.id==='modal') closeModal(); });

/* ====================== HELPERS DATA ====================== */
const T = () => S.data.tetapan;
const students = () => S.data.murid.filter(m=>String(m.AKTIF||'YA').toUpperCase()!=='TIDAK').sort((a,b)=>(+a.BIL||999)-(+b.BIL||999));
const subjects = (all) => S.data.mp.filter(m=>all||String(m.AKTIF).toUpperCase()==='Y').sort((a,b)=>(+a.SUSUNAN||99)-(+b.SUSUNAN||99));
const comps = mp => String(mp['KOMPONEN (dipisah | )']||'').split('|').map(s=>s.trim()).filter(Boolean);
const mk = (id,kod) => S.data.markah.find(x=>x.ID_MURID===id && x.KOD_MP===kod);
const tpNum = v => { const n=parseInt(String(v??'').replace(/\D/g,''),10); return n>=1&&n<=6?n:0; };
const tpBadge = v => { const n=tpNum(v); return `<span class="tp tp${n}">${n?'TP '+n:'–'}</span>`; };
const isTengah = () => /PERTENGAHAN/i.test(T().PELAPORAN||'');
const lang = () => (T().BAHASA_LAPORAN||'SK').toUpperCase();
function label(key){
  const r = S.data.bahasa.find(b=>b.JENIS==='LABEL'&&b.KUNCI===key); if(!r) return key;
  const v = r[lang()]; return (v===''||v==null||/^\d+$/.test(String(v))) ? r.SK : v;
}
function tafsiranSet(){ const L=lang(); return L==='SK' ? (isTengah()?'TENGAH':'AKHIR') : L; }
function tafsiranFor(kod){ return S.data.tafsiran.find(t=>t.SET===tafsiranSet()&&t.KOD_MP===kod) || (lang()!=='SK' ? null : null); }
function fmtDate(d){ if(!d) return ''; const x=new Date(d); if(isNaN(x)) return d; return `${x.getDate()}/${x.getMonth()+1}/${x.getFullYear()}`; }
function penyataan(stu, mp, rec){
  const n = tpNum(rec&&rec.TP_KESELURUHAN); const tf = tafsiranFor(mp.KOD_MP); const parts=[];
  if(n && tf && tf['TP'+n]) parts.push(`${stu.NAMA_RINGKAS||''} ${tf['TP'+n]}`.trim());
  if(rec && rec.ULASAN_GURU_MP) parts.push(rec.ULASAN_GURU_MP);
  return parts.join('\n') || (n?'':'Tidak Berkenaan');
}
function reportRows(stu){ // seperti makro asal: sembunyi mata pelajaran tanpa TP
  return subjects().map(mp=>({mp,rec:mk(stu.ID_MURID,mp.KOD_MP)})).filter(x=>x.rec&&tpNum(x.rec.TP_KESELURUHAN));
}

/* ====================== RENDER ====================== */
function render(){
  S.charts.forEach(c=>c.destroy()); S.charts=[];
  $('#nav').innerHTML = NAV.map(([k,i,l])=>`<button class="${S.view===k?'on':''}" onclick="go('${k}')"><span class="ico">${i}</span>${l}</button>`).join('');
  $('#who').innerHTML = `<div style="opacity:.75">${esc(T().NAMA_SEKOLAH)}</div><div style="font-weight:800;margin:4px 0 0">Kelas ${esc(T().TAHUN?T().TAHUN+' ':'')}${esc(T().KELAS)} • ${esc(T().SESI)}</div>${kelasPicker()}${isArkib()?`<span class="chip gold" style="margin-bottom:8px">📜 Rekod sejarah ${esc(T().SESI)}</span><br>`:''}`+
    (isAdmin()?`<span class="chip gold">🔓 Mod Admin</span><br><button class="btn sm" style="margin-top:10px" onclick="logout()">Log keluar</button>`
      :`<span class="chip">👁 Mod Paparan</span><br><button class="btn sm" style="margin-top:10px" onclick="askLogin()">🔐 Log masuk admin</button>`);
  (V[S.view]||V.dash)();
}
function go(v){ S.view=v; $('#side').classList.remove('open'); render(); window.scrollTo(0,0); }
const head = (t,p,extra='') => `<div class="top"><div><h1>${t}</h1><p>${p||''}</p></div><div class="row">${extra}</div></div>`;
const lockNote = () => isAdmin()?'':`<p class="lock">🔒 Paparan sahaja. <a href="#" onclick="askLogin();return false">Log masuk admin</a> untuk mengedit.</p>`;

const V = {};
/* ---------- Dashboard ---------- */
V.dash = () => {
  const st=students(), mps=subjects(); let total=0, filled=0, sum=0, cnt=0;
  st.forEach(s=>mps.forEach(m=>{ total++; const r=mk(s.ID_MURID,m.KOD_MP); const n=tpNum(r&&r.TP_KESELURUHAN); if(n){filled++;sum+=n;cnt++;} }));
  const L=st.filter(s=>/^L/i.test(s.JANTINA)).length, P=st.length-L;
  const pct = total?Math.round(filled/total*100):0;
  $('#view').innerHTML = head(`Selamat datang 👋`, `${esc(T().PELAPORAN)} • ${esc(T().NAMA_SEKOLAH)} • Tarikh pelaporan ${fmtDate(T().TARIKH_PELAPORAN)}`,
    `<button class="btn" onclick="load()">⟳ Muat semula</button><button class="btn pri" onclick="go('laporan')">📄 Cetak Laporan</button>`)+
  `<div class="grid g4">
    <div class="card stat"><div class="n">${st.length}</div><div class="l">Murid (L: ${L} • P: ${P})</div></div>
    <div class="card stat"><div class="n">${mps.length}</div><div class="l">Mata pelajaran aktif</div></div>
    <div class="card stat"><div class="n">${pct}%</div><div class="l">Rekod TP lengkap (${filled}/${total})</div><div class="bar" style="margin-top:8px"><span style="width:${pct}%;background:var(--brand-2)"></span></div></div>
    <div class="card stat"><div class="n">${cnt?(sum/cnt).toFixed(1):'–'}</div><div class="l">Purata TP kelas</div></div>
  </div>
  <div class="grid g2" style="margin-top:16px">
    <div class="card"><h3 style="margin-top:0">Kemajuan pengisian mengikut mata pelajaran</h3>
      ${mps.map(m=>{const f=st.filter(s=>tpNum((mk(s.ID_MURID,m.KOD_MP)||{}).TP_KESELURUHAN)).length; const p=st.length?Math.round(f/st.length*100):0;
        return `<div style="margin:10px 0"><div class="row"><b style="font-size:13px">${esc(m.NAMA_MATA_PELAJARAN)}</b><span class="sp"></span><span class="lock">${f}/${st.length}</span></div><div class="bar"><span style="width:${p}%;background:${p==100?'var(--ok)':'var(--gold)'}"></span></div></div>`}).join('')}
    </div>
    <div class="card"><h3 style="margin-top:0">Taburan Tahap Penguasaan kelas</h3><canvas id="chDash" height="230"></canvas>
      <div class="hint" style="margin-top:12px">TP1 = tahap penguasaan terendah • TP3 = tahap minimum • TP6 = tahap tertinggi</div></div>
  </div>`;
  const d=[0,0,0,0,0,0]; st.forEach(s=>mps.forEach(m=>{const n=tpNum((mk(s.ID_MURID,m.KOD_MP)||{}).TP_KESELURUHAN); if(n) d[n-1]++;}));
  if(window.Chart) S.charts.push(new Chart($('#chDash'),{type:'doughnut',data:{labels:['TP1','TP2','TP3','TP4','TP5','TP6'],datasets:[{data:d,backgroundColor:['#d9534f','#ee8a3c','#e8c13a','#8cc152','#3aa57a','#147a72']}]},options:{plugins:{legend:{position:'right'}}}}));
};

/* ---------- Kelas & Tahun ---------- */
V.kelas = () => {
  const ks=kelasList(); const years=[...new Set(ks.map(k=>String(k.SESI)))];
  $('#view').innerHTML = head('Kelas & Tahun','Setiap kelas bagi setiap tahun disimpan dalam sheet tersendiri. Rekod tahun lepas kekal dan boleh dibuka bila-bila masa.',
    isAdmin()?`<button class="btn pri" onclick="newKelas()">＋ Tambah Kelas Baharu</button>`:'')+lockNote()+
  (years.length?years.map(y=>`<div class="card" style="margin-bottom:16px"><h3 style="margin-top:0">Sesi ${esc(y)} <span class="lock" style="font-weight:600">• ${ks.filter(k=>String(k.SESI)===y).length} kelas</span></h3>
    <div class="tw"><table class="t"><thead><tr><th>Kelas</th><th>Guru Kelas</th><th>Sheet dalam Google Sheet</th><th>Status</th><th></th></tr></thead><tbody>
    ${ks.filter(k=>String(k.SESI)===y).map(k=>{const ark=String(k.STATUS).toUpperCase()==='ARKIB'; return `<tr><td><b>${esc(kelasLabel(k))}</b>${k.ID_KELAS===S.kelas?' <span class="chip">sedang dibuka</span>':''}</td><td>${esc(k.NAMA_GURU_KELAS)}</td>
     <td class="lock">${esc(k.SHEET_MURID)}<br>${esc(k.SHEET_MARKAH)}</td><td>${ark?'<span class="chip gold">Arkib</span>':'<span class="chip">Aktif</span>'}</td>
     <td style="white-space:nowrap"><button class="btn sm pri" onclick="switchKelas('${esc(k.ID_KELAS)}').then(()=>go('dash'))">Buka</button>
     ${isAdmin()?`<button class="btn sm" onclick="arkibKelas('${esc(k.ID_KELAS)}','${ark?'AKTIF':'ARKIB'}')">${ark?'Aktifkan':'Arkibkan'}</button>`:''}</td></tr>`}).join('')}
    </tbody></table></div></div>`).join(''):'<div class="card empty">Tiada kelas berdaftar.</div>')+
  `<div class="hint">💡 Awal tahun baharu: tekan <b>Tambah Kelas Baharu</b>, isi sesi baharu (contoh ${new Date().getFullYear()+1}) dan pilih <b>Salin murid dari</b> kelas tahun lepas — senarai murid dibawa, rekod TP bermula kosong. Rekod tahun lepas tidak terusik.</div>`;
};
function newKelas(){
  const k=S.data.kelasAktif||{}; const ks=kelasList();
  openModal(`<h2 style="margin-top:0">Tambah Kelas Baharu</h2><p class="lock">Dua sheet baharu (MURID & MARKAH) akan dicipta secara automatik dalam Google Sheet.</p>
  <div class="grid g2"><div><label class="l">Sesi (tahun kalendar)</label><input class="f" id="kSESI" value="${esc(k.SESI||new Date().getFullYear())}"></div>
  <div><label class="l">Tahun (darjah)</label><select class="f" id="kTAHUN">${['1','2','3','4','5','6',''].map(o=>`<option value="${o}">${o?'Tahun '+o:'— tiada —'}</option>`).join('')}</select></div></div>
  <label class="l">Nama kelas</label><input class="f" id="kNAMA_KELAS" placeholder="cth: AL BIRUNI">
  <label class="l">Nama guru kelas</label><input class="f" id="kNAMA_GURU_KELAS">
  <label class="l">Salin senarai murid dari (pilihan)</label><select class="f" id="kSALIN_DARI"><option value="">— Tidak, mula kosong —</option>${ks.map(x=>`<option value="${esc(x.ID_KELAS)}">${esc(x.SESI)} • ${esc(kelasLabel(x))}</option>`).join('')}</select>
  <div class="row" style="margin-top:16px"><span class="sp"></span><button class="btn" onclick="closeModal()">Batal</button><button class="btn pri" onclick="saveKelas(this)">Cipta Kelas</button></div>`);
}
function saveKelas(btn){
  const d={}; ['SESI','TAHUN','NAMA_KELAS','NAMA_GURU_KELAS','SALIN_DARI'].forEach(x=>d[x]=$('#k'+x).value.trim());
  if(!d.SESI||!d.NAMA_KELAS) return toast('Sesi dan nama kelas wajib diisi',true);
  run(btn, async()=>{ await api('createKelas',{data:d}); S.stuSel=null; S.mpSel=null; closeModal(); }, 'Kelas baharu dicipta & dibuka ✓');
}
function arkibKelas(id,status){ run(null,()=>api('arkibKelas',{id,status}), status==='ARKIB'?'Kelas diarkibkan (data kekal) ✓':'Kelas diaktifkan ✓'); }

/* ---------- Murid ---------- */
V.murid = () => {
  const st=S.data.murid.slice().sort((a,b)=>(+a.BIL||999)-(+b.BIL||999));
  $('#view').innerHTML = head('Senarai Murid',`${st.length} rekod murid dalam Google Sheet`, isAdmin()?`<button class="btn pri" onclick="editMurid()">＋ Tambah Murid</button>`:'')+lockNote()+
  `<div class="card"><input class="f" placeholder="🔎 Cari nama / MyKid…" oninput="filterRows(this.value,'#tbM')" style="margin-bottom:12px"><div class="tw"><table class="t" id="tbM"><thead><tr><th>Bil</th><th>Nama Murid</th><th>Nama Ringkas</th><th>No. MyKid</th><th>Jantina</th><th>Aktif</th><th></th></tr></thead><tbody>
  ${st.map(m=>`<tr><td>${esc(m.BIL)}</td><td><b>${esc(m.NAMA_MURID)}</b>${m.CATATAN?`<br><span class="chip red" style="margin-top:4px">${esc(m.CATATAN)}</span>`:''}</td><td>${esc(m.NAMA_RINGKAS)}</td><td>${esc(m.NO_MYKID)}</td><td>${esc(m.JANTINA)}</td><td>${esc(m.AKTIF)}</td>
  <td style="white-space:nowrap"><button class="btn sm" onclick="S.stuSel='${m.ID_MURID}';go('laporan')">📄</button> ${isAdmin()?`<button class="btn sm" onclick="editMurid('${m.ID_MURID}')">✎</button> <button class="btn sm danger" onclick="delMurid('${m.ID_MURID}')">🗑</button>`:''}</td></tr>`).join('')}
  </tbody></table></div></div>`;
};
function filterRows(q,sel){ q=q.toLowerCase(); document.querySelectorAll(sel+' tbody tr').forEach(tr=>tr.style.display=tr.textContent.toLowerCase().includes(q)?'':'none'); }
function editMurid(id){
  const m = S.data.murid.find(x=>x.ID_MURID===id)||{BIL:S.data.murid.length+1,AKTIF:'YA'};
  openModal(`<h2 style="margin-top:0">${id?'Kemaskini':'Tambah'} Murid</h2>
  <div class="grid g2"><div><label class="l">Bil</label><input class="f" id="mBIL" value="${esc(m.BIL)}"></div><div><label class="l">Jantina</label><select class="f" id="mJANTINA"><option ${/^L/i.test(m.JANTINA)?'selected':''}>L</option><option ${/^P/i.test(m.JANTINA)?'selected':''}>P</option></select></div></div>
  <label class="l">Nama Murid</label><input class="f" id="mNAMA_MURID" value="${esc(m.NAMA_MURID)}">

const ORN = (rot,pos) => `<svg class="orn" style="${pos};transform:rotate(${rot}deg)" viewBox="0 0 100 100"><g fill="none" stroke="#b8892a" stroke-width="1.6"><path d="M4 60V4h56"/><path d="M12 44V12h32"/><path d="M4 4l20 20"/><circle cx="24" cy="24" r="5" fill="#d8b25a" stroke="none"/><path d="M30 12c10 0 18 8 18 18M12 30c0 10 8 18 18 18" stroke-width="1"/></g></svg>`;

function sealSVG(t,award){

   <text font-size="6.2" font-weight="800" letter-spacing="2.4" fill="#f3d78a" font-family="Plus Jakarta Sans"><textPath href="#arc" startOffset="0">★ PENTAKSIRAN BILIK DARJAH ★ ${esc(t.SESI||'')} </textPath></text>

const SUBJ_COLORS=['#2563eb','#e11d48','#f59e0b','#10b981','#8b5cf6','#0891b2','#ea580c','#db2777','#65a30d','#0f766e','#7c3aed','#ca8a04'];
const subjColor=i=>SUBJ_COLORS[i%SUBJ_COLORS.length];
function radarSVG(rows){
  const n=rows.length, cx=300, cy=300, R=200, max=6;
  if(n<3) return `<svg viewBox="0 0 600 600"><text x="300" y="300" text-anchor="middle" fill="#4a6567" font-size="18">Perlu sekurang-kurangnya 3 mata pelajaran ber-TP untuk carta labah-labah.</text></svg>`;
  const ang=i=>-Math.PI/2+i*2*Math.PI/n;
  const pt=(i,v)=>[cx+R*v/max*Math.cos(ang(i)), cy+R*v/max*Math.sin(ang(i))];
  const vals=rows.map(r=>tpNum(r.rec.TP_KESELURUHAN));
  let g='';
  // cincin skala
  for(let l=max;l>=1;l--){ g+=`<polygon points="${rows.map((_,i)=>pt(i,l).join(',')).join(' ')}" fill="${l%2?'#f6faf9':'#fff'}" stroke="${l===max?'#0f5257':'#c9dbd9'}" stroke-width="${l===max?1.6:1}" ${l===max?'':'stroke-dasharray="2 4"'}/>`; }
  // jejari berwarna lembut
  rows.forEach((_,i)=>{const [x,y]=pt(i,max); g+=`<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="${subjColor(i)}" stroke-opacity=".35" stroke-width="1.2"/>`;});
  // label skala
  for(let l=1;l<=max;l++){ const [x,y]=pt(0,l); g+=`<rect x="${x+5}" y="${y-8}" width="16" height="14" rx="3" fill="#0f5257"/><text x="${x+13}" y="${y+3}" text-anchor="middle" font-size="10" fill="#fff" font-weight="800" font-family="JetBrains Mono,monospace">${l}</text>`; }
  // segmen berwarna mengikut subjek (kawasan poligon dibahagi)
  const P=vals.map((v,i)=>pt(i,v));
  const mid=(a,b)=>[(a[0]+b[0])/2,(a[1]+b[1])/2];
  P.forEach((p,i)=>{ const pr=P[(i-1+n)%n], nx=P[(i+1)%n]; const m1=mid(pr,p), m2=mid(p,nx);
    g+=`<polygon points="${cx},${cy} ${m1.join(',')} ${p.join(',')} ${m2.join(',')}" fill="${subjColor(i)}" fill-opacity=".30" stroke="none"/>`; });
  // purata
  const avgc=vals.reduce((a,b)=>a+b,0)/n;
  g+=`<polygon points="${rows.map((_,i)=>pt(i,avgc).join(',')).join(' ')}" fill="none" stroke="#c9962b" stroke-width="1.6" stroke-dasharray="6 5"/>`;
  // garis luar
  g+=`<polygon points="${P.map(p=>p.join(',')).join(' ')}" fill="none" stroke="#0b3d40" stroke-width="2.4" stroke-linejoin="round"/>`;
  // garis jejari ke nilai + titik
  P.forEach((p,i)=>{ g+=`<line x1="${cx}" y1="${cy}" x2="${p[0]}" y2="${p[1]}" stroke="${subjColor(i)}" stroke-width="3" stroke-linecap="round"/>`; });
  P.forEach((p,i)=>{ g+=`<circle cx="${p[0]}" cy="${p[1]}" r="11" fill="#fff" stroke="${subjColor(i)}" stroke-width="3"/><text x="${p[0]}" y="${p[1]+4}" text-anchor="middle" font-size="11" font-weight="900" fill="${subjColor(i)}" font-family="JetBrains Mono,monospace">${vals[i]}</text>`; });
  g+=`<circle cx="${cx}" cy="${cy}" r="4" fill="#0b3d40"/>`;
  // label
  rows.forEach((r,i)=>{const a=ang(i); const x=cx+(R+34)*Math.cos(a), y=cy+(R+34)*Math.sin(a);
    const anc=Math.abs(Math.cos(a))<.25?'middle':Math.cos(a)>0?'start':'end';
    const words=titleCase(r.mp.NAMA_MATA_PELAJARAN).replace(/^Asas 3m - /i,'').replace(/^Pendidikan Seni Kesejahteraan \(/i,'(').split(' ');
    const lines=[]; let cur=''; words.forEach(w=>{ if((cur+' '+w).trim().length>18){ if(cur) lines.push(cur); cur=w; } else cur=(cur+' '+w).trim(); }); if(cur) lines.push(cur);
    const ls=lines.slice(0,4); const y0=y-(ls.length-1)*7+(Math.sin(a)>.5?10:Math.sin(a)<-.5?-12:0);
    const bx=anc==='middle'?x:anc==='start'?x+9:x-9; const tx=anc==='middle'?x:anc==='start'?x+22:x-22;
    const by=anc==='middle'?y0-20:y0-4;
    g+=`<circle cx="${anc==='middle'?x:bx}" cy="${by}" r="9" fill="${subjColor(i)}"/><text x="${anc==='middle'?x:bx}" y="${by+3.6}" text-anchor="middle" font-size="10" font-weight="900" fill="#fff">${i+1}</text>`;
    const lx=anc==='middle'?x:tx;
    g+=`<text text-anchor="${anc}" font-size="12.5" font-weight="700" fill="#0f2a2c">${ls.map((l,k)=>`<tspan x="${lx}" y="${y0+k*14}">${esc(l)}</tspan>`).join('')}<tspan x="${lx}" y="${y0+ls.length*14+3}" fill="${subjColor(i)}" font-weight="900" font-size="13.5" font-family="JetBrains Mono,monospace">TP ${vals[i]}</tspan></text>`;});
  return `<svg viewBox="-95 -20 790 640" width="100%" height="100%">${g}</svg>`;
}
function profileHTML(s){
  const t=T(); const {rows,tps,avg,award}=certStats(s);
  const sorted=rows.map((r,i)=>({r,v:tps[i],i})).sort((a,b)=>b.v-a.v);
  const best=sorted.filter(x=>x.v===(sorted[0]||{}).v).map(x=>titleCase(x.r.mp.NAMA_MATA_PELAJARAN));
  const low=sorted.length?sorted[sorted.length-1].v:0; const weak=sorted.filter(x=>x.v===low&&low<sorted[0].v).map(x=>titleCase(x.r.mp.NAMA_MATA_PELAJARAN));
  const mastery=tps.filter(v=>v>=4).length;
  return `<div class="prof"><div class="grid-bg"></div>
   <div class="hd">${t.LOGO_URL?`<img src="${esc(t.LOGO_URL)}">`:''}<div><div class="k">PROFIL PRESTASI MURID • ${esc(t.PELAPORAN)}</div><div class="t">${esc(titleCase(s.NAMA_MURID))}</div></div>
    <div class="r">${esc(t.NAMA_SEKOLAH)}<br><b>${esc(t.TAHUN?('Tahun '+t.TAHUN+' '):'')}${esc(t.KELAS)}</b> • MyKid ${esc(s.NO_MYKID)}</div></div>
   <div class="chart">${radarSVG(rows)}</div>
   <div class="pside">
    <div class="kpis"><div class="glass kpi"><div class="v">${avg.toFixed(2)}</div><div class="l">PURATA TP</div></div><div class="glass kpi"><div class="v">${mastery}/${rows.length}</div><div class="l">MP TP4 KE ATAS</div></div><div class="glass kpi g"><div class="v" style="font-size:15px;padding:2mm 0 1.3mm">${award}</div><div class="l">PENGIKTIRAFAN</div></div></div>
    <div class="glass bars"><div class="ttlx">TAHAP PENGUASAAN MENGIKUT MATA PELAJARAN</div>
     ${sorted.map(x=>{const c=subjColor(x.i);return `<div class="b"><div class="ix" style="background:${c}">${x.i+1}</div><div class="nmx">${esc(titleCase(x.r.mp.NAMA_MATA_PELAJARAN))}</div><div class="tr">${[1,2,3,4,5,6].map(k=>`<i style="${k<=x.v?'background:'+c:''}"></i>`).join('')}</div><div class="n" style="color:${c}">TP${x.v}</div></div>`}).join('')}</div>
    <div class="glass ins"><div class="ttlx">ANALISIS RINGKAS</div>
     Kekuatan utama: <b>${esc(best.join(', ')||'-')}</b>.<br>${weak.length?`Fokus penambahbaikan: <b>${esc(weak.join(', '))}</b>.`:'Prestasi seimbang merentas semua mata pelajaran.'}<br>
     <span style="color:#5b7577">Garis putus emas = purata TP murid (${avg.toFixed(1)}). Skala 1–6.</span></div>
   </div>
   <div class="ft"><span>e-PBD • PENTAKSIRAN BILIK DARJAH ${esc(t.SESI||'')}</span><span>DIJANA ${fmtDate(new Date())}</span></div>
  </div>`;
}
V.sijil = () => {
  const st=students(); if(!S.stuSel||!st.find(s=>s.ID_MURID===S.stuSel)) S.stuSel=(st[0]||{}).ID_MURID; const s=st.find(x=>x.ID_MURID===S.stuSel);
  $('#view').innerHTML = head('Sijil PBD','Sijil penghargaan berdasarkan TP keseluruhan murid (A4 melintang).',
   `<button class="btn" onclick="printDocs('cert',[S.stuSel])">🖨 Cetak sijil ini</button><button class="btn gold" onclick="printDocs('cert',students().map(s=>s.ID_MURID))">🏅 Cetak SEMUA sijil</button><label class="chip" style="cursor:pointer"><input type="checkbox" id="withProf" ${S.withProf!==false?'checked':''} onchange="S.withProf=this.checked"> + Profil spider</label>`)+
  `<div class="card" style="margin-bottom:16px"><div class="row"><button class="btn sm" onclick="stepStu(-1)">◀</button><select class="f" style="flex:1" onchange="S.stuSel=this.value;render()">
   ${st.map((x,i)=>`<option value="${x.ID_MURID}" ${x.ID_MURID===S.stuSel?'selected':''}>${i+1}. ${esc(x.NAMA_MURID)}</option>`).join('')}</select><button class="btn sm" onclick="stepStu(1)">▶</button></div>
   <div class="row" style="margin-top:10px"><button class="btn sm ${S.certPage!=='prof'?'pri':''}" onclick="S.certPage='cert';render()">🏅 Sijil</button><button class="btn sm ${S.certPage==='prof'?'pri':''}" onclick="S.certPage='prof';render()">🕸 Profil Prestasi (Spider Chart)</button></div><p class="lock" style="margin:10px 0 0">Pengiktirafan: purata TP ≥5 Cemerlang • ≥4 Kepujian • ≥3 Baik • lain-lain Penghargaan.</p></div>
  <div style="overflow:auto"><div class="preview-scale" style="transform-origin:top left">${s?(S.certPage==='prof'?profileHTML(s):certHTML(s)):''}</div></div>`;
};
function printDocs(kind, ids){
  const list=ids.map(id=>students().find(s=>s.ID_MURID===id)).filter(Boolean);
  $('#printArea').innerHTML = list.map(s=>kind==='cert'?certHTML(s)+(S.withProf!==false?profileHTML(s):''):reportHTML(s)).join('');
  let ps=document.getElementById('pageStyle'); if(!ps){ps=document.createElement('style');ps.id='pageStyle';document.head.appendChild(ps);}
  ps.textContent = kind==='cert' ? '@page{size:A4 landscape;margin:0}' : '@page{size:A4 portrait;margin:0}';
  toast(`Menyediakan ${list.length} dokumen untuk dicetak…`);
  setTimeout(()=>window.print(),400);
}

/* ---------- Analisis ---------- */
V.analisis = () => {
  const st=students(), mps=subjects();
  const dist=mps.map(m=>{ const d=[0,0,0,0,0,0], dl=[0,0,0,0,0,0], dp=[0,0,0,0,0,0]; st.forEach(s=>{const n=tpNum((mk(s.ID_MURID,m.KOD_MP)||{}).TP_KESELURUHAN); if(n){d[n-1]++; (/^L/i.test(s.JANTINA)?dl:dp)[n-1]++;}}); return {m,d,dl,dp}; });
  $('#view').innerHTML = head('Analisis & Graf Pelaporan','Laporan mata pelajaran, taburan TP mengikut jantina dan matriks prestasi kelas.',`<button class="btn" onclick="exportCSV()">⬇ Muat turun CSV</button><button class="btn" onclick="window.print()" style="display:none"></button>`)+
  `<div class="card"><h3 style="margin-top:0">Graf taburan TP mengikut mata pelajaran</h3><canvas id="chA" height="110"></canvas></div>
  <div class="card" style="margin-top:16px"><h3 style="margin-top:0">Laporan Mata Pelajaran (bilangan murid)</h3><div class="tw"><table class="t"><thead><tr><th>Mata Pelajaran</th>${[1,2,3,4,5,6].map(i=>`<th>TP${i}<br><span style="opacity:.7">L / P</span></th>`).join('')}<th>Jumlah</th><th>≥ TP3 (minimum)</th></tr></thead><tbody>
  ${dist.map(({m,d,dl,dp})=>{const tot=d.reduce((a,b)=>a+b,0), min=d.slice(2).reduce((a,b)=>a+b,0); return `<tr><td><b>${esc(m.NAMA_MATA_PELAJARAN)}</b></td>${d.map((x,i)=>`<td>${x?`<b>${x}</b> <span class="lock">(${dl[i]}/${dp[i]})</span>`:'<span class="lock">0</span>'}</td>`).join('')}<td><b>${tot}</b></td><td>${tot?Math.round(min/tot*100)+'%':'–'}</td></tr>`}).join('')}</tbody></table></div></div>
  <div class="card" style="margin-top:16px"><h3 style="margin-top:0">Matriks TP Keseluruhan murid</h3><div class="tw"><table class="t"><thead><tr><th>Bil</th><th>Nama</th>${mps.map(m=>`<th title="${esc(m.NAMA_MATA_PELAJARAN)}">${esc(m.KOD_MP)}</th>`).join('')}<th>Purata</th></tr></thead><tbody>
  ${st.map((s,i)=>{const v=mps.map(m=>tpNum((mk(s.ID_MURID,m.KOD_MP)||{}).TP_KESELURUHAN)); const f=v.filter(Boolean); return `<tr><td>${i+1}</td><td>${esc(s.NAMA_RINGKAS||s.NAMA_MURID)}</td>${v.map(x=>`<td>${tpBadge(x)}</td>`).join('')}<td><b>${f.length?(f.reduce((a,b)=>a+b,0)/f.length).toFixed(1):'–'}</b></td></tr>`}).join('')}</tbody></table></div></div>`;
  if(window.Chart){ const C=['#d9534f','#ee8a3c','#e8c13a','#8cc152','#3aa57a','#147a72'];
    S.charts.push(new Chart($('#chA'),{type:'bar',data:{labels:mps.map(m=>m.KOD_MP),datasets:[0,1,2,3,4,5].map(i=>({label:'TP'+(i+1),data:dist.map(x=>x.d[i]),backgroundColor:C[i]}))},options:{responsive:true,scales:{x:{stacked:true},y:{stacked:true,ticks:{precision:0}}},plugins:{tooltip:{callbacks:{title:it=>mps[it[0].dataIndex].NAMA_MATA_PELAJARAN}}}}})); }
};
function exportCSV(){
  const mps=subjects(); const rows=[['BIL','NAMA','MYKID','JANTINA',...mps.map(m=>m.NAMA_MATA_PELAJARAN)]];
  students().forEach((s,i)=>rows.push([i+1,s.NAMA_MURID,s.NO_MYKID,s.JANTINA,...mps.map(m=>tpNum((mk(s.ID_MURID,m.KOD_MP)||{}).TP_KESELURUHAN)||'')]));
  const csv='\ufeff'+rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'})); a.download=`Analisis_PBD_${T().KELAS}.csv`; a.click();
}

/* ---------- Mata pelajaran ---------- */

function editMP(kod){

  openModal(`<h2 style="margin-top:0">${kod?'Kemaskini':'Tambah'} Mata Pelajaran</h2>
  <div class="grid g2"><div><label class="l">Kod (unik)</label><input class="f" id="pKOD_MP" value="${esc(m.KOD_MP)}" ${kod?'disabled':''}></div><div><label class="l">Susunan pada laporan</label><input class="f" id="pSUSUNAN" value="${esc(m.SUSUNAN)}"></div></div>
  <label class="l">Nama mata pelajaran (seperti pada laporan)</label><input class="f" id="pNAMA_MATA_PELAJARAN" value="${esc(m.NAMA_MATA_PELAJARAN)}">
  <label class="l">Nama guru mata pelajaran</label><input class="f" id="pNAMA_GURU_MP" value="${esc(m.NAMA_GURU_MP)}">
  <label class="l">Bidang / komponen (satu baris satu komponen, maks 12)</label><textarea class="f" id="pKOMP" rows="5">${esc(comps(m).join('\n'))}</textarea>
  <div class="grid g2"><div><label class="l">Aktif (papar dalam laporan)</label><select class="f" id="pAKTIF"><option value="Y" ${String(m.AKTIF).toUpperCase()==='Y'?'selected':''}>Ya</option><option value="N" ${String(m.AKTIF).toUpperCase()!=='Y'?'selected':''}>Tidak</option></select></div><div><label class="l">Catatan</label><input class="f" id="pCATATAN" value="${esc(m.CATATAN)}"></div></div>
  <p class="hint">Penyataan TP diambil dari sheet 05_TAFSIRAN_TP mengikut kod mata pelajaran. Tambah tafsiran di menu Tafsiran TP.</p>
  <div class="row" style="margin-top:16px"><span class="sp"></span><button class="btn" onclick="closeModal()">Batal</button><button class="btn pri" onclick="saveMP(this)">Simpan</button></div>`);
}
function saveMP(btn){
  const d={}; ['KOD_MP','SUSUNAN','NAMA_MATA_PELAJARAN','NAMA_GURU_MP','AKTIF','CATATAN'].forEach(k=>d[k]=$('#p'+k).value.trim());
  d.KOD_MP=d.KOD_MP.toUpperCase().replace(/\s+/g,''); d['KOMPONEN (dipisah | )']=$('#pKOMP').value.split('\n').map(s=>s.trim()).filter(Boolean).slice(0,12).join(' | ');
  if(!d.KOD_MP||!d.NAMA_MATA_PELAJARAN) return toast('Kod dan nama wajib diisi',true);
  run(btn,async()=>{ await api('saveMP',{data:d}); closeModal(); },'Mata pelajaran disimpan ✓');
}
function delMP(kod){ if(confirm('Padam mata pelajaran '+kod+' beserta semua rekod markahnya?')) run(null,()=>api('deleteMP',{id:kod}),'Mata pelajaran dipadam'); }

/* ---------- Tafsiran ---------- */
V.tafsiran = () => {
  const sets=[...new Set(S.data.tafsiran.map(t=>t.SET))]; S.tSet=S.tSet||tafsiranSet();

  $('#view').innerHTML = head('Tafsiran Tahap Penguasaan','Penyataan TP keseluruhan yang digunakan dalam laporan murid.', isAdmin()?`<button class="btn pri" onclick="editTaf()">＋ Tambah</button>`:'')+
  `<div class="card" style="margin-bottom:16px"><div class="row">${sets.map(s=>`<button class="btn sm ${S.tSet===s?'pri':''}" onclick="S.tSet='${s}';render()">${s==='TENGAH'?'Tengah Tahun':s==='AKHIR'?'Akhir Tahun':s}</button>`).join('')}<span class="sp"></span><span class="chip">Sedang digunakan: ${tafsiranSet()}</span></div></div>
  ${list.map((t,i)=>`<div class="card" style="margin-bottom:12px"><div class="row"><h3 style="margin:0">${esc(t.MATA_PELAJARAN)}</h3><span class="chip">${esc(t.KOD_MP||'—')}</span><span class="sp"></span>${isAdmin()&&t.KOD_MP?`<button class="btn sm" onclick="editTaf('${t.SET}','${t.KOD_MP}')">✎</button>`:''}</div>
   <div class="grid g3" style="margin-top:10px">${[1,2,3,4,5,6].map(n=>`<div style="font-size:13px"><span class="tp tp${n}">TP ${n}</span> <span style="white-space:pre-line">${esc(t['TP'+n])}</span></div>`).join('')}</div></div>`).join('')||'<div class="card empty">Tiada tafsiran</div>'}`;
};
function editTaf(set,kod){
  const t=S.data.tafsiran.find(x=>x.SET===set&&x.KOD_MP===kod)||{SET:S.tSet};
  openModal(`<h2 style="margin-top:0">Tafsiran TP</h2><div class="grid g2"><div><label class="l">Set</label><input class="f" id="tSET" value="${esc(t.SET)}" ${kod?'disabled':''}></div><div><label class="l">Kod MP</label><input class="f" id="tKOD_MP" value="${esc(t.KOD_MP)}" ${kod?'disabled':''}></div></div>
  <label class="l">Nama mata pelajaran</label><input class="f" id="tMATA_PELAJARAN" value="${esc(t.MATA_PELAJARAN)}">
  ${[1,2,3,4,5,6].map(n=>`<label class="l">TP ${n}</label><textarea class="f" rows="2" id="tTP${n}">${esc(t['TP'+n])}</textarea>`).join('')}
  <div class="row" style="margin-top:16px"><span class="sp"></span><button class="btn" onclick="closeModal()">Batal</button><button class="btn pri" onclick="saveTaf(this)">Simpan</button></div>`);
}
function saveTaf(btn){ const d={}; ['SET','KOD_MP','MATA_PELAJARAN','TP1','TP2','TP3','TP4','TP5','TP6'].forEach(k=>d[k]=$('#t'+k).value.trim()); run(btn,async()=>{await api('saveTafsiran',{data:d});closeModal();},'Tafsiran disimpan ✓'); }

   <li>Cetak <b>Laporan Murid</b> dan <b>Sijil PBD</b> (satu murid atau semua sekali). Pilih "Save as PDF" untuk simpan PDF.</li></ol></div>`;

V.tetapan = () => {
  const t=T(); const dis=isAdmin()?'':'disabled';
  const F=(k,l,type='text')=>`<div><label class="l">${l}</label><input class="f" type="${type}" id="s_${k}" value="${esc(t[k])}" ${dis}></div>`;
  $('#view').innerHTML = head('Tetapan','Maklumat sekolah dikongsi semua kelas (01_TETAPAN). Kelas, tahun, sesi & guru kelas disimpan untuk kelas yang sedang dibuka sahaja.', isAdmin()?`<button class="btn pri" onclick="saveSet(this)">💾 Simpan Tetapan</button>`:'')+lockNote()+
  `<div class="card"><div class="grid g2">${F('NAMA_SEKOLAH','Nama sekolah')}${F('ALAMAT_SEKOLAH','Alamat sekolah')}${F('NAMA_GURU_KELAS','Nama guru kelas')}${F('KELAS','Kelas')}${F('NAMA_GURU_BESAR','Nama guru besar')}${F('JAWATAN_PENTADBIR','Jawatan pentadbir')}
   <div><label class="l">Pelaporan</label><select class="f" id="s_PELAPORAN" ${dis}>${['PENTAKSIRAN PERTENGAHAN TAHUN','PENTAKSIRAN AKHIR TAHUN'].map(o=>`<option ${t.PELAPORAN===o?'selected':''}>${o}</option>`).join('')}</select></div>
   ${F('TARIKH_PELAPORAN','Tarikh pelaporan','date')}
   <div><label class="l">Jenis sekolah</label><select class="f" id="s_JENIS_SEKOLAH" ${dis}>${['SEK KEB (SK)','SEK JENIS KEB (SJK)','PENDIDIKAN KHAS','INKLUSIF'].map(o=>`<option ${t.JENIS_SEKOLAH===o?'selected':''}>${o}</option>`).join('')}</select></div>
   <div><label class="l">Bahasa laporan</label><select class="f" id="s_BAHASA_LAPORAN" ${dis}>${['SK','SJKC','SJKT'].map(o=>`<option ${lang()===o?'selected':''}>${o}</option>`).join('')}</select></div>
   ${F('TAHUN','Tahun')}${F('SESI','Sesi')}${F('TAJUK_SIJIL','Tajuk sijil')}<div><label class="l">Logo sekolah (dipaparkan pada sijil)</label><input type="hidden" id="s_LOGO_URL" value="${esc(t.LOGO_URL)}">
    <div class="logo-up"><div class="pv" id="logoPv">${t.LOGO_URL?`<img src="${esc(t.LOGO_URL)}">`:'Tiada logo'}</div><div style="flex:1">
    ${isAdmin()?`<input type="file" accept="image/*" id="logoFile" onchange="pickLogo(this)" style="display:none"><button class="btn sm pri" type="button" onclick="$('#logoFile').click()">⬆ Muat naik logo</button> <button class="btn sm" type="button" onclick="setLogo('')">✕ Buang</button><div class="hint" style="font-size:12px;margin-top:6px">PNG/JPG. Logo diperkecil automatik. Tekan <b>Simpan Tetapan</b> selepas muat naik.</div>`:'<div class="hint">Log masuk admin untuk muat naik logo.</div>'}</div></div></div>
   ${isAdmin()?`<div><label class="l">Kata laluan admin baharu (kosong = kekal)</label><input class="f" type="password" id="s_ADMIN_PASSWORD"></div>`:''}
  </div></div>`;
};
function setLogo(url){ $('#s_LOGO_URL').value=url; $('#logoPv').innerHTML=url?`<img src="${url}">`:'Tiada logo'; }
function pickLogo(inp){
  const f=inp.files[0]; if(!f) return;
  const rd=new FileReader(); rd.onload=()=>{ const im=new Image(); im.onload=()=>{
    let size=360, out='';
    for(let k=0;k<8;k++){ const sc=Math.min(1,size/Math.max(im.width,im.height)); const c=document.createElement('canvas'); c.width=Math.round(im.width*sc); c.height=Math.round(im.height*sc);
      c.getContext('2d').drawImage(im,0,0,c.width,c.height); out=c.toDataURL('image/png'); if(out.length>45000) out=c.toDataURL('image/webp',.85); if(out.length<=45000) break; size=Math.round(size*.8); }
    if(out.length>48000){ toast('Logo terlalu besar, cuba imej lain',true); return; }
    setLogo(out); toast('Logo dimuat naik — tekan Simpan Tetapan ✓');
  }; im.src=rd.result; }; rd.readAsDataURL(f);
}
function saveSet(btn){
  const keys=['NAMA_SEKOLAH','ALAMAT_SEKOLAH','NAMA_GURU_KELAS','KELAS','NAMA_GURU_BESAR','JAWATAN_PENTADBIR','PELAPORAN','TARIKH_PELAPORAN','JENIS_SEKOLAH','BAHASA_LAPORAN','TAHUN','SESI','TAJUK_SIJIL','LOGO_URL','ADMIN_PASSWORD'];
  const d={}; keys.forEach(k=>{const el=$('#s_'+k); if(el) d[k]=el.value.trim();});
  const newPw=d.ADMIN_PASSWORD; if(!newPw) delete d.ADMIN_PASSWORD;
  run(btn,async()=>{ await api('saveTetapan',{data:d}); if(newPw){S.pass=newPw;sessionStorage.setItem('pbd_pw',newPw);} },'Tetapan disimpan ✓');
}
